<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #0a0d14;
    --bg2: #0f1320;
    --bg3: #161c2e;
    --card: #1a2035;
    --card2: #1f2640;
    --border: #2a3350;
    --border2: #344066;
    --accent: #4f8ef7;
    --accent2: #6ba3ff;
    --accent-glow: rgba(79,142,247,0.18);
    --teal: #2dd4bf;
    --teal-dim: rgba(45,212,191,0.15);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.15);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.15);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --purple: #a855f7;
    --purple-dim: rgba(168,85,247,0.15);
    --text: #e2e8f8;
    --text2: #8fa3cc;
    --text3: #5a6d94;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }
  #root { min-height: 100vh; }

  /* LAYOUT */
  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    animation: fadeIn 0.5s ease;
  }
  .screen-top {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
    animation: fadeIn 0.5s ease;
  }
  .container { width: 100%; max-width: 900px; }
  .container-lg { width: 100%; max-width: 1100px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes barFill { from { width: 0; } to { width: var(--target-w); } }
  @keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* TYPOGRAPHY */
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  h1.hero { font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.1; color: var(--text); }
  h2.section-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; color: var(--text); }
  h3.card-title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .subtitle { font-size: 1.05rem; color: var(--text2); line-height: 1.6; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); }
  .value { font-size: 1.1rem; font-weight: 700; color: var(--text); }
  .hint { font-size: 0.82rem; color: var(--text3); line-height: 1.5; }
  .context-box {
    background: var(--accent-glow);
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: var(--text2);
    line-height: 1.6;
  }
  .context-box strong { color: var(--accent2); }

  /* CARDS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .card:hover { border-color: var(--border2); box-shadow: var(--shadow); }
  .card-sm { background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 700px) {
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .grid-3 { grid-template-columns: 1fr; }
  }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 28px; border-radius: var(--radius-sm); border: none;
    font-family: var(--font); font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: all 0.18s; text-decoration: none; white-space: nowrap;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6b5ef8);
    color: #fff;
    box-shadow: 0 0 24px rgba(79,142,247,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(79,142,247,0.55); }
  .btn-primary:active { transform: translateY(0); }
  .btn-outline {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-outline:hover { background: var(--card2); color: var(--text); border-color: var(--accent); }
  .btn-ghost {
    background: transparent; color: var(--text3);
    border: 1px solid transparent; padding: 8px 16px;
  }
  .btn-ghost:hover { color: var(--text); background: var(--card2); }
  .btn-lg { padding: 16px 40px; font-size: 1.05rem; }
  .btn-sm { padding: 8px 18px; font-size: 0.82rem; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  /* SELECTABLE CARDS */
  .selectable {
    cursor: pointer; position: relative; transition: all 0.2s;
    border: 2px solid var(--border);
  }
  .selectable:hover { border-color: var(--accent); background: var(--card2); transform: translateY(-2px); }
  .selectable.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(79,142,247,0.12), rgba(107,95,248,0.08));
    box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(79,142,247,0.07);
  }
  .selectable.selected-green { border-color: var(--green); background: var(--green-dim); }
  .selectable.selected-teal { border-color: var(--teal); background: var(--teal-dim); }
  .check-badge {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; font-weight: 700;
    animation: popIn 0.2s ease;
  }

  /* PROGRESS BARS */
  .progress-wrap { margin-bottom: 12px; }
  .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .progress-label { font-size: 0.82rem; color: var(--text2); }
  .progress-val { font-size: 0.82rem; font-weight: 700; color: var(--text); }
  .progress-track { height: 7px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
  .progress-bar {
    height: 100%; border-radius: 99px;
    transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* BADGE */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 99px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .badge-red { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .badge-amber { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
  .badge-green { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
  .badge-blue { background: var(--accent-glow); color: var(--accent2); border: 1px solid rgba(79,142,247,0.3); }
  .badge-purple { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
  .badge-teal { background: var(--teal-dim); color: var(--teal); border: 1px solid rgba(45,212,191,0.3); }

  /* CRISIS CARD */
  .crisis-card {
    background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(245,158,11,0.06));
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius); padding: 24px;
    position: relative; overflow: hidden;
  }
  .crisis-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--red), var(--amber));
  }
  .crisis-icon { font-size: 2.5rem; margin-bottom: 10px; }

  /* SCORE RING */
  .score-ring-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 0;
  }
  .score-big {
    font-size: 5rem; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, var(--accent2), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .score-label { font-size: 0.85rem; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  /* NEGOTIATION */
  .nego-track { display: flex; gap: 6px; margin-bottom: 16px; }
  .nego-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg3); border: 1.5px solid var(--border);
    transition: all 0.3s;
  }
  .nego-dot.done { background: var(--accent); border-color: var(--accent); }
  .nego-dot.current { background: var(--amber); border-color: var(--amber); animation: pulse 1.2s infinite; }

  /* STAT ROW */
  .stat-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stat-chip {
    display: flex; align-items: center; gap: 5px; padding: 5px 10px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 99px;
    font-size: 0.78rem; color: var(--text2);
  }
  .stat-chip .icon { font-size: 0.85rem; }

  /* STEP NAV */
  .step-nav {
    display: flex; align-items: center; gap: 0; margin-bottom: 32px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 99px; padding: 4px; width: fit-content; max-width: 100%;
    overflow-x: auto; scrollbar-width: none;
  }
  .step-nav::-webkit-scrollbar { display: none; }
  .step-pill {
    padding: 6px 14px; border-radius: 99px; font-size: 0.75rem; font-weight: 600;
    color: var(--text3); white-space: nowrap; transition: all 0.2s;
  }
  .step-pill.active { background: var(--accent); color: #fff; }
  .step-pill.done { color: var(--accent2); }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .gap-16 { gap: 16px; }
  .flex { display: flex; }
  .flex-col { display: flex; flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .flex-wrap { flex-wrap: wrap; }
  .mb-4 { margin-bottom: 4px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .mb-24 { margin-bottom: 24px; }
  .mb-32 { margin-bottom: 32px; }
  .mt-8 { margin-top: 8px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .text-center { text-align: center; }
  .w-full { width: 100%; }
  .feedback-box {
    background: var(--card2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px;
  }
  .feedback-box .fb-label { font-size: 0.75rem; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .feedback-box .fb-content { font-size: 0.88rem; color: var(--text2); line-height: 1.6; }
  .ai-card {
    background: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(79,142,247,0.06));
    border: 2px solid var(--border);
    border-radius: var(--radius); padding: 18px; cursor: pointer; transition: all 0.2s;
  }
  .ai-card:hover { border-color: var(--purple); transform: translateY(-2px); }
  .ai-card.selected { border-color: var(--purple); background: var(--purple-dim); }
  .welcome-glow {
    position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
    width: 800px; height: 500px;
    background: radial-gradient(ellipse at center, rgba(79,142,247,0.12) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .welcome-content { position: relative; z-index: 1; }
  .metric-card {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px; text-align: center;
  }
  .metric-val { font-size: 1.6rem; font-weight: 800; margin-bottom: 2px; }
  .metric-label { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
  .delta { font-size: 0.75rem; font-weight: 700; margin-top: 2px; }
  .delta-pos { color: var(--green); }
  .delta-neg { color: var(--red); }
  .option-number {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg3); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700; color: var(--text3);
    flex-shrink: 0;
  }
  .selected .option-number { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); margin-right: 4px; }
  .answer-btn {
    width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 8px;
    background: var(--card2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s;
    font-family: var(--font); font-size: 0.88rem; color: var(--text2); line-height: 1.5;
  }
  .answer-btn:hover { border-color: var(--accent); color: var(--text); background: var(--bg3); }
  .answer-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--text); }
  .answer-btn.wrong { border-color: var(--red); background: var(--red-dim); color: var(--text2); }
  .answer-btn.best { border-color: var(--amber); background: var(--amber-dim); }
  .answer-btn:disabled { cursor: default; }
  .q-counter { font-size: 0.78rem; color: var(--text3); margin-bottom: 4px; }
  .final-grade {
    display: inline-block; padding: 6px 20px; border-radius: 99px;
    font-weight: 800; font-size: 1.1rem; margin-top: 6px;
  }
</style>
</head>

/* ── HELPERS ── */
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFrom(arr, n) {
  const copy = [...arr]; const out = [];
  for (let i = 0; i < n; i++) { const idx = Math.floor(Math.random() * copy.length); out.push(copy.splice(idx,1)[0]); }
  return out;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function colorForVal(v) {
  if (v >= 70) return 'var(--green)';
  if (v >= 40) return 'var(--amber)';
  return 'var(--red)';
}
function generateCompany() {
  const base = rand(COMPANIES);

    ...base,
    revenue: `$${randInt(1,9)}.${randInt(1,9)}B`,
    factories: randInt(2, 8),

    countries: randFrom(COUNTRIES, randInt(3,6)),
    employees: `${randInt(3,50)},000`,
    founded: randInt(1962, 2008),
  };
}
function generateCrisis() { return rand(CRISES); }

function ProgressBar({ label, value, color, showDelta, delta }) {
  const [displayed, setDisplayed] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setDisplayed(value), 80);
    return () => clearTimeout(t);
  }, [value]);
  return (
    <div className="progress-wrap">
      <div className="progress-row">
        <span className="progress-label">{label}</span>
        <span className="progress-val" style={{ color: colorForVal(displayed) }}>
          {displayed}%
          {showDelta && delta !== 0 && (
            <span style={{ marginLeft: 6, fontSize: '0.72rem', color: delta > 0 ? 'var(--green)' : 'var(--red)' }}>
              {delta > 0 ? `+${delta}` : delta}
            </span>
          )}
        </span>
      </div>
      <div className="progress-track">
        <div className="progress-bar" style={{
          width: `${displayed}%`,
          background: color || colorForVal(displayed),
          transition: 'width 1.2s cubic-bezier(0.25,1,0.5,1)'
        }} />
      </div>
    </div>
  );
}

function NegotiationScreen({ onNext }) {
  const [round, setRound] = useState(0);
  const [trust, setTrust] = useState(50);
  const [price, setPrice] = useState(50);
  const [leadTime, setLeadTime] = useState(50);
  const [chosen, setChosen] = useState([]);
  const [revealed, setRevealed] = useState(null);
  const [done, setDone] = useState(false);
  const negoScore = Math.round((trust + (100 - price) + (100 - leadTime)) / 3);

  const pick = (opt, idx) => {
    if (revealed !== null) return;
    setRevealed(idx);
    setTimeout(() => {
      setTrust(v => clamp(v + opt.trust, 0, 100));
      setPrice(v => clamp(v + opt.price, 0, 100));
      setLeadTime(v => clamp(v + opt.lead, 0, 100));
      setChosen(c => [...c, { round, optIdx: idx, opt }]);
      setTimeout(() => {
        setRevealed(null);
        if (round + 1 >= NEGO_ROUNDS.length) setDone(true);
        else setRound(r => r + 1);
      }, 1200);
    }, 300);
  };

  const current = NEGO_ROUNDS[round];
  const negoGrade = negoScore >= 75 ? { label: 'Elite Negotiator', color: 'var(--green)' }
    : negoScore >= 55 ? { label: 'Solid Negotiator', color: 'var(--accent)' }
    : negoScore >= 35 ? { label: 'Fair Negotiator', color: 'var(--amber)' }
    : { label: 'Needs Work', color: 'var(--red)' };

  return (
    <div className="screen-top">
      <div className="container">
        <StepNav step={4}/>
        <div className="eyebrow mb-8">Supplier Negotiation</div>
        <h2 className="section-title mb-20">Negotiate Your Way Out</h2>
        {!done ? (
          <>
            <div className="nego-track mb-20">
              {NEGO_ROUNDS.map((r,i) => (
                <div key={i} className={`nego-dot ${i < round ? 'done' : i === round ? 'current' : ''}`} />
              ))}
              <span style={{ marginLeft:8, fontSize:'0.78rem', color:'var(--text3)' }}>Round {round+1} of {NEGO_ROUNDS.length}</span>
            </div>
            <div className="card mb-16">
              <div className="flex items-center" style={{ gap:8, marginBottom:8 }}>
                <span className="badge badge-blue">Round {round+1}</span>
                <span style={{ fontWeight:700 }}>{current.title}</span>
              </div>
              <p style={{ fontSize:'0.88rem', color:'var(--text2)', lineHeight:1.6 }}>{current.context}</p>
            </div>
            <div className="context-box mb-20">
              <strong>What are you negotiating?</strong> Trust determines how much your supplier prioritizes you. 
              Price affects your margins. Lead Time determines how fast you get product. All three matter.
            </div>
            <div className="flex flex-col" style={{ gap:10, marginBottom:24 }}>
              {current.options.map((opt, i) => (
                <button key={i} disabled={revealed !== null}
                  className={`answer-btn ${revealed === i ? 'best' : ''}`}
                  onClick={() => pick(opt, i)}>
                  <div style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                    <div className="option-number" style={{ marginTop:1, flexShrink:0 }}>{i+1}</div>
                    <div>
                      <div>{opt.text}</div>
                      {revealed === i && <div style={{ marginTop:8, fontSize:'0.78rem', color:'var(--teal)', fontWeight:600 }}>💡 {opt.note}</div>}
                    </div>
                  </div>
                </button>
              ))}
            </div>
          </>
        ) : (
          <div style={{ animation:'popIn 0.4s ease' }}>
            <div className="card mb-20" style={{ textAlign:'center' }}>
              <div style={{ fontSize:'3rem', marginBottom:8 }}>🤝</div>
              <div className="score-big" style={{ fontSize:'3.5rem', marginBottom:4 }}>{negoScore}</div>
              <div className="score-label">Negotiation Score</div>
              <div className="final-grade" style={{ background: 'var(--card2)', color: negoGrade.color, marginTop:8 }}>
                {negoGrade.label}
              </div>
            </div>
            <div className="grid-3 mb-20">
              {[
                { label:'Supplier Trust', value: trust, color:'var(--green)' },
                { label:'Price Control', value: 100-price, color:'var(--teal)' },
                { label:'Lead Time Gain', value: 100-leadTime, color:'var(--accent)' },
              ].map(m => (
                <div key={m.label} className="metric-card">
                  <div className="metric-val" style={{ color: m.color }}>{m.value}%</div>
                  <div className="metric-label">{m.label}</div>
                </div>
              ))}
            </div>
            <div className="flex" style={{ justifyContent:'flex-end' }}>
              <button className="btn btn-primary" onClick={() => onNext(negoScore)}>Enter the CEO Boardroom →</button>
            </div>
          </div>
        )}
        <div className="card" style={{ marginTop:20 }}>
          <div className="label mb-12">Live Negotiation Status</div>
          <ProgressBar label="Supplier Trust" value={trust} color="var(--green)" />
          <ProgressBar label="Price Pressure" value={price} color="var(--red)" />
          <ProgressBar label="Lead Time Risk" value={leadTime} color="var(--amber)" />
        </div>
      </div>
    </div>
  );
}

function CEOBoardroom({ onNext }) {
  const [qIdx, setQIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [chosen, setChosen] = useState(null);
  const [history, setHistory] = useState([]);
  const [done, setDone] = useState(false);

  const q = CEO_QUESTIONS[qIdx];
  const totalPossible = CEO_QUESTIONS.reduce((a,q) => a + Math.max(...q.options.map(o=>o.score)), 0);

  const pick = (opt, i) => {
    if (chosen !== null) return;
    setChosen(i);
    setTimeout(() => {
      const newScore = score + opt.score;
      setScore(newScore);
      setHistory(h => [...h, { qIdx, optIdx: i, score: opt.score, best: opt.best }]);
      setTimeout(() => {
        setChosen(null);
        if (qIdx + 1 >= CEO_QUESTIONS.length) setDone(true);
        else setQIdx(q => q + 1);
      }, 1000);
    }, 200);
  };

  const pct = Math.round((score / totalPossible) * 100);
  const grade = pct >= 80 ? { label:'Visionary Leader', color:'var(--green)' }
    : pct >= 60 ? { label:'Strong Executive', color:'var(--accent)' }
    : pct >= 40 ? { label:'Developing Leader', color:'var(--amber)' }
    : { label:'At Risk', color:'var(--red)' };

  return (
    <div className="screen-top">
      <div className="container">
        <StepNav step={5}/>
        <div className="eyebrow mb-8">Executive Decision-Making</div>
        <h2 className="section-title mb-20">CEO Boardroom Simulation</h2>
        {!done ? (
          <>
            <div className="context-box mb-16">
              <strong>Why this section?</strong> Supply chain crises escalate to the C-suite within 48 hours. 
              How the CEO responds determines whether the company recovers or compounds the damage. These are real leadership dilemmas.
            </div>
            <div className="card mb-16">
              <div className="q-counter">{qIdx+1} of {CEO_QUESTIONS.length}</div>
              <div style={{ fontWeight:700, fontSize:'1.05rem', lineHeight:1.55, marginBottom:12, color:'var(--text)' }}>{q.q}</div>
              <div style={{ fontSize:'0.8rem', color:'var(--text3)', lineHeight:1.5, padding:'10px 14px', background:'var(--bg3)', borderRadius:6 }}>
                💡 Context: {q.context}
              </div>
            </div>
            <div style={{ marginBottom:24 }}>
              {q.options.map((opt, i) => (
                <button key={i} disabled={chosen !== null}
                  className={`answer-btn ${chosen===i ? (opt.best?'correct':'wrong') : (chosen!==null&&opt.best?'correct':'')}`}
                  onClick={() => pick(opt, i)}>
                  <div style={{ display:'flex', gap:10, alignItems:'flex-start' }}>
                    <div className="option-number" style={{ marginTop:1 }}>{String.fromCharCode(65+i)}</div>
                    <div>
                      <div>{opt.text}</div>
                      {chosen !== null && opt.best && (
                        <div style={{ marginTop:6, fontSize:'0.75rem', color:'var(--green)', fontWeight:600 }}>✓ Best answer (+{opt.score} pts)</div>
                      )}
                    </div>
                  </div>
                </button>
              ))}
            </div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <span style={{ fontSize:'0.82rem', color:'var(--text3)' }}>Score: {score} pts</span>
              <div style={{ display:'flex', gap:4 }}>
                {CEO_QUESTIONS.map((_,i) => (
                  <div key={i} style={{
                    width:8, height:8, borderRadius:'50%',
                    background: i < qIdx ? 'var(--accent)' : i===qIdx ? 'var(--amber)' : 'var(--border)'
                  }}/>
                ))}
              </div>
            </div>
          </>
        ) : (
          <div style={{ animation:'popIn 0.4s ease' }}>
            <div className="card mb-20 text-center">
              <div style={{ fontSize:'3rem', marginBottom:8 }}>🏛️</div>
              <div className="score-big" style={{ fontSize:'3.5rem', marginBottom:4 }}>{pct}</div>
              <div className="score-label">Leadership Score</div>
              <div className="final-grade" style={{ background:'var(--card2)', color:grade.color }}>{grade.label}</div>
            </div>
            <div className="card mb-20">
              <div className="label mb-12">Question Breakdown</div>
              {history.map((h,i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                  padding:'8px 0', borderBottom: i<history.length-1?'1px solid var(--border)':'' }}>
                  <span style={{ fontSize:'0.82rem', color:'var(--text2)' }}>Question {i+1}</span>
                  <span style={{ fontWeight:700, color: h.best ? 'var(--green)' : h.score >= 10 ? 'var(--amber)' : 'var(--red)' }}>
                    {h.best ? '✓ Optimal' : h.score >= 10 ? '~ Good' : '✗ Suboptimal'} +{h.score}
                  </span>
                </div>
              ))}
            </div>
            <div className="flex" style={{ justifyContent:'flex-end' }}>
              <button className="btn btn-primary" onClick={() => onNext(pct)}>Design Your AI Strategy →</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AIStrategyScreen({ onNext }) {
  const [selected, setSelected] = useState([]);
  const toggle = (id) => {
    if (selected.includes(id)) setSelected(selected.filter(x => x !== id));
    else if (selected.length < 2) setSelected([...selected, id]);
  };
  return (
    <div className="screen-top">
      <div className="container">
        <StepNav step={6}/>
        <div className="eyebrow mb-8">Future Resilience</div>
        <h2 className="section-title mb-8">AI Investment Strategy</h2>
        <p className="subtitle mb-20">Once the crisis is contained, where do you invest to prevent the next one? Choose <strong style={{ color:'var(--accent2)' }}>2 AI tools</strong>.</p>
        <div className="context-box mb-20">
          <strong>Why AI?</strong> Supply chains that use AI experience 15% lower operational costs, 35% faster response to disruptions, 
          and 50% better forecast accuracy than those relying on manual processes. But not every tool fits every company — choose wisely.
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:24 }}>
          {AI_TOOLS.map(tool => {
            const isSel = selected.includes(tool.id);
            return (
              <div key={tool.id} className={`ai-card ${isSel ? 'selected' : ''}`}
                style={{ opacity: (!isSel && selected.length >= 2) ? 0.45 : 1 }}
                onClick={() => toggle(tool.id)}>
                <div className="flex items-center" style={{ gap:12, marginBottom:10 }}>
                  {isSel && <div className="check-badge" style={{ position:'static', width:22, height:22, flexShrink:0 }}>✓</div>}
                  <span style={{ fontSize:'1.6rem' }}>{tool.emoji}</span>
                  <div>
                    <div style={{ fontWeight:700, marginBottom:2 }}>{tool.name}</div>
                    <span className="badge badge-purple">{tool.category}</span>
                  </div>
                  <div style={{ marginLeft:'auto', fontSize:'0.78rem', fontWeight:700, color:'var(--teal)' }}>{tool.roi}</div>
                </div>
                <p style={{ fontSize:'0.82rem', color:'var(--text2)', marginBottom:10, lineHeight:1.5 }}>{tool.description}</p>
                {isSel && (
                  <div style={{ marginTop:4 }}>
                    <div className="label mb-6">Expected Business Impact:</div>
                    {tool.impacts.map((imp, i) => (
                      <div key={i} style={{ display:'flex', gap:6, alignItems:'flex-start', marginBottom:5 }}>
                        <span style={{ color:'var(--green)', flexShrink:0 }}>✓</span>
                        <span style={{ fontSize:'0.78rem', color:'var(--text2)' }}>{imp}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div className="flex" style={{ justifyContent:'flex-end' }}>
          <button className="btn btn-primary" disabled={selected.length !== 2} onClick={() => onNext(selected)}>
            View Final Results →
          </button>
        </div>
      </div>
    </div>
  );
}

function FinalDashboard({ company, crisis, warActions, negoScore, ceoScore, aiTools, onReplay }) {
  const chosenActions = ACTIONS.filter(a => warActions.includes(a.id));
  const chosenAI = AI_TOOLS.filter(t => aiTools.includes(t.id));

  // Compute sub-scores
  const negotiationScore = negoScore;
  const leadershipScore = ceoScore;

  const hasInsurance = warActions.includes('insurance');
  const hasCrisisTeam = warActions.includes('crisis');
  const hasComm = warActions.includes('comm');
  const hasAlt = warActions.includes('alt');

  const resilienceScore = clamp(
    50 + (hasAlt ? 20 : 0) + (hasCrisisTeam ? 10 : 0) + Math.round(negoScore * 0.2), 0, 100
  );
  const costControlScore = clamp(
    50 + (hasInsurance ? 20 : -10) + chosenActions.reduce((a,act) => a + act.effects.cost, 0) * 1.5, 0, 100
  );
  const riskScore = clamp(
    40 + (aiTools.includes('supplier') ? 25 : 0) + (aiTools.includes('forecast') ? 15 : 0) + Math.round(leadershipScore * 0.2), 0, 100
  );
  const custSatScore = clamp(
    40 + (hasComm ? 25 : 0) + chosenActions.reduce((a,act) => a + act.effects.satisfaction, 0) * 1.2, 0, 100
  );
  const overallScore = Math.round((negotiationScore + leadershipScore + resilienceScore + costControlScore + riskScore + custSatScore) / 6);

  const grade = overallScore >= 80 ? { label:'Crisis Master', emoji:'🏆', color:'var(--green)', fb:'Outstanding performance under pressure. You handled every phase with exceptional skill.' }
    : overallScore >= 65 ? { label:'Experienced Leader', emoji:'⭐', color:'var(--accent)', fb:'Strong overall performance. A few refinements and you\'d be setting the industry standard.' }
    : overallScore >= 50 ? { label:'Capable Manager', emoji:'📈', color:'var(--amber)', fb:'Solid fundamentals. Some decisions left value on the table — keep learning.' }
    : { label:'Crisis Survivor', emoji:'🎯', color:'var(--red)', fb:'You got through it, but there were costly missteps. Review the lessons carefully.' };

  const bestAction = chosenActions.reduce((a, b) =>
    (a.effects.satisfaction + a.effects.speed) > (b.effects.satisfaction + b.effects.speed) ? a : b, chosenActions[0]);
  const worstCheck = !hasComm && !hasAlt;
  const biggestMistake = !hasAlt ? 'Not activating alternative suppliers left you single-source dependent during the crisis.'
    : !hasComm ? 'Skipping proactive customer communication is a hidden trust destroyer.'
    : negoScore < 45 ? 'Aggressive negotiation tactics eroded supplier trust when you needed it most.'
    : 'Your decisions were largely sound.';

  const subScores = [
    { label:'Leadership', value:leadershipScore, color:'var(--accent)' },
    { label:'Negotiation', value:negotiationScore, color:'var(--teal)' },
    { label:'Resilience', value:resilienceScore, color:'var(--purple)' },
    { label:'Cost Control', value:costControlScore, color:'var(--amber)' },
    { label:'Risk Mgmt', value:riskScore, color:'var(--green)' },
    { label:'Customer Sat.', value:custSatScore, color:'var(--accent2)' },
  ];

  return (
    <div className="screen-top">
      <div className="container-lg">
        <StepNav step={7}/>
        <div className="eyebrow mb-8">Crisis Complete</div>
        <h2 className="section-title mb-24">Final Performance Dashboard</h2>
        <div style={{ display:'grid', gridTemplateColumns:'220px 1fr', gap:24, marginBottom:32, alignItems:'start' }}>
          <div className="card text-center" style={{ padding:28 }}>
            <div style={{ fontSize:'4.5rem', fontWeight:900, lineHeight:1,
              background:'linear-gradient(135deg, var(--accent2), var(--teal))',
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text' }}>
              {overallScore}
            </div>
            <div style={{ fontSize:'0.72rem', color:'var(--text3)', textTransform:'uppercase', letterSpacing:1, marginTop:4 }}>Overall Score</div>
            <div className="final-grade" style={{ background:'var(--card2)', color:grade.color, marginTop:8 }}>
              {grade.emoji} {grade.label}
            </div>
          </div>
          <div className="card">
            <div className="label mb-12">Score Breakdown</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'6px 20px' }}>
              {subScores.map(s => (
                <ProgressBar key={s.label} label={s.label} value={s.value} color={s.color} />
              ))}
            </div>
          </div>
        </div>
        <div className="grid-2 mb-24">
          <div className="feedback-box">
            <div className="fb-label">📊 Overall Performance</div>
            <div className="fb-content">{grade.fb}</div>
          </div>
          <div className="feedback-box" style={{ borderColor:'var(--red)', borderLeft:'3px solid var(--red)' }}>
            <div className="fb-label" style={{ color:'var(--red)' }}>⚠ Biggest Mistake</div>
            <div className="fb-content">{biggestMistake}</div>
          </div>
          <div className="feedback-box" style={{ borderColor:'var(--green)', borderLeft:'3px solid var(--green)' }}>
            <div className="fb-label" style={{ color:'var(--green)' }}>✓ Best Decision</div>
            <div className="fb-content">
              {bestAction ? `${bestAction.emoji} ${bestAction.title} — ${bestAction.why}` : 'Keep making smart choices.'}
            </div>
          </div>
          <div className="feedback-box" style={{ borderColor:'var(--teal)', borderLeft:'3px solid var(--teal)' }}>
            <div className="fb-label" style={{ color:'var(--teal)' }}>💡 Expert Recommendation</div>
            <div className="fb-content">
              {overallScore >= 70
                ? `You showed real crisis instincts. Next level: pre-build supplier redundancy before the crisis, not during it.`
                : `Focus on building supplier diversity and crisis playbooks before disruptions happen — reactive decisions always cost more.`}
            </div>
          </div>
        </div>
        <div className="card mb-24">
          <div className="label mb-16">📚 Key Lessons From This Simulation</div>
          <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
            {[
              { icon:'🔄', title:'Supplier Diversification is Non-Negotiable', lesson:`Companies with 3+ qualified suppliers for critical components recover from disruptions 2.7x faster. Single-source is a ticking clock.` },
              { icon:'📢', title:'Communication is a Supply Chain Tool', lesson:`Proactive customer communication during crises preserves 60% more revenue than going silent. Customers don't punish problems — they punish surprises.` },
              { icon:'🤝', title:'Partnership Negotiation Beats Pressure Tactics', lesson:`Suppliers prioritize partners over customers. Sharing data, risk, and incentives creates resilience that contract leverage never will.` },
              { icon:'🤖', title:'AI Creates Anticipatory Supply Chains', lesson:`AI doesn't just automate tasks — it shifts supply chains from reactive to predictive. ${chosenAI.map(t=>t.name).join(' and ')} were smart choices for long-term resilience.` },
            ].map(l => (
              <div key={l.icon} style={{ display:'flex', gap:14, alignItems:'flex-start', padding:'12px 0', borderBottom:'1px solid var(--border)' }}>
                <span style={{ fontSize:'1.3rem', flexShrink:0, marginTop:2 }}>{l.icon}</span>
                <div>
                  <div style={{ fontWeight:700, marginBottom:4, fontSize:'0.9rem' }}>{l.title}</div>
                  <div style={{ fontSize:'0.82rem', color:'var(--text2)', lineHeight:1.55 }}>{l.lesson}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="card mb-32" style={{ background:'linear-gradient(135deg, rgba(79,142,247,0.08), rgba(168,85,247,0.06))' }}>
          <div className="label mb-12">Your Simulation Summary</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
            <div><div className="label mb-4">Company</div><div style={{ fontWeight:700 }}>{company.emoji} {company.name}</div></div>
            <div><div className="label mb-4">Crisis Faced</div><div style={{ fontWeight:700 }}>{crisis.emoji} {crisis.name}</div></div>
            <div><div className="label mb-4">Final Score</div><div style={{ fontWeight:700, color:'var(--accent2)' }}>{overallScore}/100</div></div>
            <div><div className="label mb-4">War Room Choices</div><div style={{ fontWeight:700 }}>{chosenActions.map(a=>a.title).join(', ')}</div></div>
            <div><div className="label mb-4">AI Investments</div><div style={{ fontWeight:700 }}>{chosenAI.map(t=>t.name).join(' + ')}</div></div>
            <div><div className="label mb-4">Grade</div><div style={{ fontWeight:700, color:grade.color }}>{grade.label}</div></div>
          </div>
        </div>
        <div className="flex items-center" style={{ gap:14, justifyContent:'center' }}>
          <button className="btn btn-primary btn-lg" onClick={onReplay}>🔁 Run Another Simulation</button>
          <span style={{ fontSize:'0.82rem', color:'var(--text3)' }}>New company · New crisis · New challenge</span>
        </div>
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [step, setStep] = useState(0);
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [warActions, setWarActions] = useState([]);
  const [negoScore, setNegoScore] = useState(0);
  const [ceoScore, setCeoScore] = useState(0);
  const [aiTools, setAiTools] = useState([]);

  const start = () => {
    setCompany(generateCompany());
    setCrisis(generateCrisis());
    setStep(1);
  };
  const replay = () => {
    setStep(0); setWarActions([]); setNegoScore(0); setCeoScore(0); setAiTools([]);
  };

  if (step === 0) return <Welcome onStart={start} />;
  if (step === 1) return <CompanyScreen company={company} onNext={() => setStep(2)} />;
  if (step === 2) return <CrisisScreen company={company} crisis={crisis} onNext={() => setStep(3)} />;
  if (step === 3) return <WarRoomScreen crisis={crisis} onNext={(sel) => { setWarActions(sel); setStep(4); }} />;
  if (step === 4) return <NegotiationScreen onNext={(score) => { setNegoScore(score); setStep(5); }} />;
  if (step === 5) return <CEOBoardroom onNext={(score) => { setCeoScore(score); setStep(6); }} />;
  if (step === 6) return <AIStrategyScreen onNext={(tools) => { setAiTools(tools); setStep(7); }} />;
  if (step === 7) return <FinalDashboard company={company} crisis={crisis} warActions={warActions}
    negoScore={negoScore} ceoScore={ceoScore} aiTools={aiTools} onReplay={replay} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
