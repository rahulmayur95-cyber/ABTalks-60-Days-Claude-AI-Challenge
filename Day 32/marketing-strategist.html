<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist: Grow This Brand</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0e1320;
    --bg-deep:#0a0e18;
    --surface:#161d2e;
    --surface-2:#1d2740;
    --surface-3:#26325091;
    --border:rgba(231,234,242,0.09);
    --border-strong:rgba(231,234,242,0.18);
    --text:#eaedf5;
    --muted:#93a0c2;
    --muted-2:#5c6685;
    --accent:#f5b843;
    --accent-soft:#f5b84322;
    --accent-ink:#2b1f04;
    --teal:#3fc7b0;
    --teal-soft:#3fc7b022;
    --danger:#e8636b;
    --danger-soft:#e8636b22;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Archivo Black','Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(63,199,176,0.08), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(245,184,67,0.07), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  .shell{
    max-width:1080px;
    margin:0 auto;
    padding:28px 20px 90px;
  }
  .topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brandmark .mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#c98d1f);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:18px;color:var(--accent-ink);
    flex:none;
    box-shadow:0 6px 18px rgba(245,184,67,0.25);
  }
  .brandmark h1{
    font-family:var(--font-display);
    font-size:15px;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
  }
  .brandmark p{margin:2px 0 0;font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .session-badge{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    background:var(--surface);
    white-space:nowrap;
  }

  /* Stepper */
  .stepper{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:28px;
    scrollbar-width:thin;
  }
  .step{
    flex:1 1 0;
    min-width:74px;
    text-align:center;
    position:relative;
    padding-top:14px;
  }
  .step .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--surface-2);
    border:2px solid var(--border-strong);
    margin:0 auto 6px;
    position:relative;
    z-index:2;
    transition:all .3s ease;
  }
  .step .bar{
    position:absolute;
    top:18px;left:-50%;right:50%;
    height:2px;
    background:var(--border-strong);
    z-index:1;
  }
  .step:first-child .bar{display:none;}
  .step.done .dot{background:var(--teal);border-color:var(--teal);}
  .step.done .bar{background:var(--teal);}
  .step.active .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .step label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.3px;
    color:var(--muted-2);
    text-transform:uppercase;
    display:block;
  }
  .step.active label{color:var(--accent);}
  .step.done label{color:var(--teal);}

  /* Cards */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:18px;
    animation:fadeUp .45s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 8px;
  }
  h2.section-title{
    font-family:var(--font-display);
    font-size:26px;
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:0.2px;
  }
  h3.card-title{
    font-family:var(--font-display);
    font-size:16px;
    margin:0 0 8px;
    letter-spacing:0.2px;
  }
  .lede{color:var(--muted);font-size:15px;margin:0 0 4px;}

  .teach-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:18px 0;
  }
  @media (max-width:640px){ .teach-box{grid-template-columns:1fr;} }
  .teach-tile{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 16px;
  }
  .teach-tile .tt-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .teach-tile.what .tt-label{color:var(--teal);}
  .teach-tile.why .tt-label{color:var(--accent);}
  .teach-tile p{margin:0;font-size:13.5px;color:var(--text);opacity:0.92;}

  /* Buttons */
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border-radius:999px;
    padding:11px 20px;
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    cursor:pointer;
    transition:transform .15s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--muted-2);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#d99c25);
    color:var(--accent-ink);
    border-color:transparent;
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent;}
  .btn-small{padding:7px 14px;font-size:12.5px;}
  .btn-danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .nav-row .right-group{display:flex;gap:10px;flex-wrap:wrap;}

  /* Welcome */
  .hero{
    text-align:left;
    padding:8px 4px 6px;
  }
  .hero .kicker{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--accent);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(32px,6vw,52px);
    line-height:1.03;
    margin:0 0 16px;
    letter-spacing:0.2px;
  }
  .hero p.sub{
    font-size:16px;
    color:var(--muted);
    max-width:560px;
    margin:0 0 26px;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:22px;
  }
  @media (max-width:720px){ .hero-grid{grid-template-columns:1fr;} }
  .stat-chip{
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:var(--radius-sm);
    padding:14px;
  }
  .stat-chip .num{font-family:var(--font-mono);font-size:20px;color:var(--teal);}
  .stat-chip .lab{font-size:12px;color:var(--muted);margin-top:4px;}

  /* Mode cards */
  .mode-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:6px;
  }
  @media (max-width:820px){ .mode-grid{grid-template-columns:1fr;} }
  .mode-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    cursor:pointer;
    transition:all .2s ease;
    position:relative;
    overflow:hidden;
  }
  .mode-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.35);}
  .mode-card .icon{font-size:28px;margin-bottom:12px;display:block;}
  .mode-card h3{font-family:var(--font-display);font-size:16px;margin:0 0 8px;}
  .mode-card p{font-size:13px;color:var(--muted);margin:0;}

  /* Form */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);}
  .field input, .field select, .field textarea{
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:14px;
    font-family:var(--font-body);
    outline:none;
    transition:border-color .2s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}

  /* Profile summary */
  .profile-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:14px;
  }
  @media (max-width:640px){ .profile-grid{grid-template-columns:1fr;} }
  .profile-item{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 14px;
  }
  .profile-item .pi-k{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted-2);margin-bottom:4px;}
  .profile-item .pi-v{font-size:14px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .chip{
    font-family:var(--font-mono);
    font-size:11px;
    background:var(--surface-3);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px 10px;
    color:var(--text);
  }

  /* Platform cards */
  .platform-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:720px){ .platform-grid{grid-template-columns:1fr;} }
  .platform-card{
    position:relative;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px;
    cursor:pointer;
    transition:all .18s ease;
  }
  .platform-card:hover{border-color:var(--muted-2);}
  .platform-card.selected{border-color:var(--accent);background:linear-gradient(180deg, rgba(245,184,67,0.09), rgba(245,184,67,0.02));}
  .platform-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .platform-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;}
  .fit-badge{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .fit-high{background:var(--teal-soft);color:var(--teal);border-color:rgba(63,199,176,0.4);}
  .fit-medium{background:var(--accent-soft);color:var(--accent);border-color:rgba(245,184,67,0.4);}
  .fit-low{background:var(--danger-soft);color:var(--danger);border-color:rgba(232,99,107,0.4);}
  .platform-card p{font-size:12.5px;color:var(--muted);margin:0 0 6px;}
  .platform-reason{font-size:12px;color:var(--text);opacity:0.85;border-top:1px dashed var(--border);padding-top:8px;margin-top:8px;}
  .stamp{
    position:absolute;
    top:10px;right:10px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:1px;
    padding:3px 8px;
    border-radius:5px;
    transform:rotate(-6deg) scale(1);
    animation:stampIn .35s cubic-bezier(.2,1.6,.4,1);
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
  }
  @keyframes stampIn{
    0%{opacity:0;transform:rotate(-6deg) scale(2.2);}
    70%{opacity:1;}
    100%{opacity:1;transform:rotate(-6deg) scale(1);}
  }

  /* Pillars */
  .pillar-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:820px){ .pillar-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .pillar-grid{grid-template-columns:1fr;} }
  .pillar-card{
    position:relative;
    background:var(--surface-2);
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    padding:15px;
    cursor:pointer;
    transition:all .18s ease;
    min-height:150px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .pillar-card:hover{border-color:var(--muted-2);}
  .pillar-card.selected{border-color:var(--teal);background:linear-gradient(180deg, rgba(63,199,176,0.1), rgba(63,199,176,0.02));}
  .pillar-card.locked{opacity:0.4;cursor:not-allowed;}
  .pillar-goal{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--muted-2);
  }
  .pillar-name{font-family:var(--font-display);font-size:14px;margin:6px 0;}
  .pillar-desc{font-size:12px;color:var(--muted);margin:0;}
  .pick-counter{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--accent);
    margin-top:14px;
  }

  /* Roadmap */
  .week-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
  .week-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-left:3px solid var(--teal);
    border-radius:var(--radius-sm);
    padding:16px 18px;
  }
  .week-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .week-num{font-family:var(--font-mono);color:var(--teal);font-size:12px;letter-spacing:1px;}
  .week-title{font-family:var(--font-display);font-size:15px;}
  .week-goal{font-size:12.5px;color:var(--muted);margin:0 0 10px;font-style:italic;}
  .week-card ul{margin:0;padding-left:18px;}
  .week-card li{font-size:13.5px;margin-bottom:5px;}

  /* Event */
  .event-card{
    background:linear-gradient(180deg, rgba(232,99,107,0.08), transparent);
    border:1px solid rgba(232,99,107,0.35);
    border-radius:var(--radius);
    padding:20px;
    margin:16px 0;
  }
  .event-tag{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--danger);
    margin-bottom:8px;
    display:inline-block;
  }
  .event-options{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .option-btn{
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    padding:13px 15px;
    cursor:pointer;
    color:var(--text);
    font-family:var(--font-body);
    transition:all .18s ease;
  }
  .option-btn:hover{border-color:var(--accent);}
  .option-btn.chosen{border-color:var(--accent);background:linear-gradient(180deg, rgba(245,184,67,0.1), transparent);}
  .option-btn .ob-label{font-weight:700;font-size:13.5px;margin-bottom:3px;display:block;}
  .consequence-box{
    margin-top:16px;
    background:var(--surface-2);
    border:1px solid var(--teal);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    animation:fadeUp .35s ease both;
  }
  .consequence-box .cb-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;display:block;}

  /* Report */
  .report-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:16px;
  }
  @media (max-width:720px){ .report-grid{grid-template-columns:1fr;} }
  .report-item{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px 18px;
  }
  .report-item h4{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  .report-item p{margin:0;font-size:13.5px;color:var(--text);opacity:0.95;}
  .report-item.wide{grid-column:1 / -1;}
  .score-wrap{display:flex;align-items:center;gap:16px;}
  .score-num{font-family:var(--font-display);font-size:40px;color:var(--teal);}
  .score-bar-track{flex:1;height:10px;background:var(--surface-3);border-radius:999px;overflow:hidden;}
  .score-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:999px;transition:width .6s ease;}
  .lessons-list{margin:0;padding-left:20px;}
  .lessons-list li{margin-bottom:8px;font-size:13.5px;}

  /* Claude prompt card */
  .claude-card{
    background:var(--bg-deep);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius-sm);
    padding:16px 18px;
    margin-top:18px;
  }
  .claude-tag{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--border-strong);
    border-radius:999px;
    padding:3px 10px;
  }
  .claude-prompt{
    font-family:var(--font-mono);
    font-size:12.5px;
    line-height:1.6;
    color:var(--text);
    background:var(--surface);
    border-radius:8px;
    padding:12px 14px;
    margin:10px 0 12px;
    white-space:pre-wrap;
  }

  .footer-note{
    text-align:center;
    color:var(--muted-2);
    font-size:11.5px;
    font-family:var(--font-mono);
    margin-top:36px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ---------------------------------------------------------------
   DATA
--------------------------------------------------------------- */

const STEPS = ["Start","Mode","Setup","Audience","Platforms","Pillars","Roadmap","Curveball","Report"];

const RANDOM_BUSINESSES = [
  { name:"Ember & Root", industryType:"product", industryLabel:"Cold-Pressed Juice Brand",
    audience:"Health-conscious urban professionals, 25-40, who want convenience without giving up wellness goals.",
    budget:"Medium ($2,500/mo)", competitors:["Pulp & Co.","Verdant Juicery","DailyGreens"],
    challenge:"Customers love the product in-store but the brand is invisible online — almost no repeat purchases are driven by social media." },
  { name:"Ironclad Fitness Studio", industryType:"service", industryLabel:"Boutique Fitness Studio",
    audience:"Local working professionals, 28-45, who want community-driven workouts instead of anonymous big-box gyms.",
    budget:"Low ($600/mo)", competitors:["PowerHouse Gym","FlexStudio","CoreWorks"],
    challenge:"Foot traffic is fine but nobody outside a 2-mile radius has heard of the studio, capping growth." },
  { name:"Wilder & Hide", industryType:"product", industryLabel:"Handmade Leather Goods",
    audience:"Design-conscious shoppers, 30-55, willing to pay a premium for craftsmanship and story.",
    budget:"Low ($800/mo)", competitors:["Saddleback Co.","Common Projects Leather","OakHide Supply"],
    challenge:"Beautiful product, but the brand has no consistent story — every post looks like a different company." },
  { name:"Loopwork", industryType:"b2b", industryLabel:"SaaS for Freelancers (invoicing & time tracking)",
    audience:"Independent freelancers and small agency owners, 24-45, who are overwhelmed by admin work.",
    budget:"Medium ($3,000/mo)", competitors:["Bonsai","HoneyBook","FreshBooks"],
    challenge:"Great free trial conversion, but almost nobody outside existing search traffic knows the product exists." },
  { name:"Cinder Row Coffee", industryType:"product", industryLabel:"Local Coffee Roaster",

function computeScore(mode, selectedPlatforms, industryType, eventOption){
  let score = 52;
  selectedPlatforms.forEach(pid=>{
    const fit = getFit(pid, mode, industryType);
    if(fit === "high") score += 8;
    else if(fit === "medium") score += 2;
    else score -= 5;
  });
  if(eventOption){
    if(eventOption.tone === "good") score += 14;
    else if(eventOption.tone === "mixed") score += 3;
    else score -= 10;
  }
  score = Math.max(8, Math.min(97, score));
  let label = "Slow Burn";
  if(score >= 40 && score < 70) label = "Steady Climb";
  if(score >= 70) label = "Breakout Potential";
  return { score, label };
}

function bestAndWorst(mode, selectedPlatforms, industryType, eventOption){
  const withFit = selectedPlatforms.map(pid=>({pid, fit:getFit(pid, mode, industryType), name:PLATFORMS.find(p=>p.id===pid).name}));
  const best = withFit.slice().sort((a,b)=> (b.fit==="high") - (a.fit==="high"))[0];
  const worst = withFit.find(p=>p.fit==="low");
  let bestText = best ? `Choosing ${best.name} — it's a ${best.fit}-fit platform for this brand and audience, so effort there compounds fastest.` : "You kept your platform list focused, which protects effort from being spread too thin.";
  let mistakeText = worst
    ? `Including ${worst.name} — it's a low-fit platform here, so time spent there will likely underperform compared to your other choices.`
    : (eventOption && eventOption.tone === "risky"
        ? "The riskier response to the curveball event — it solved the moment but likely cost more trust than it protected."
        : "No major misstep here — the biggest risk now is simply staying too safe to stand out.");
  return { bestText, mistakeText };
}

function AskClaudeCard({ prompt }){
  const [copied, setCopied] = useState(false);
  const copy = () => {
    if(navigator.clipboard){
      navigator.clipboard.writeText(prompt).then(()=>{
        setCopied(true);
        setTimeout(()=>setCopied(false), 1800);
      }).catch(()=>{});
    }
  };
  return (
    <div className="claude-card">
      <span className="claude-tag">How to ask Claude</span>
      <div className="claude-prompt">{prompt}</div>
      <button className="btn btn-ghost btn-small" onClick={copy}>{copied ? "Copied ✓" : "Copy prompt"}</button>
    </div>
  );
}

            </div>
            <div className="mode-card" onClick={()=>chooseMode("random")}>
              <span className="icon">🎲</span>
              <h3>A New Client Has Arrived</h3>
              <p>Get randomly assigned a business with a real industry, audience, budget and challenge — like your first day at an agency.</p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 2: SETUP ---------- */
  if(stage === 2){
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 2 · Set up the brand</p>
          <h2 className="section-title">
            {mode === "own" ? "Tell us about your business" : mode === "personal" ? "Tell us about you" : "Meet your new client"}
          </h2>

          {mode === "random" && brand && (
            <>
              <p className="lede">A strategist doesn't get to pick their client. Here's who just walked in the door.</p>
              <div className="profile-grid">
                <div className="profile-item"><div className="pi-k">Business</div><div className="pi-v">{brand.name}</div></div>
                <div className="profile-item"><div className="pi-k">Industry</div><div className="pi-v">{brand.industryLabel}</div></div>
                <div className="profile-item full" style={{gridColumn:"1 / -1"}}><div className="pi-k">Audience</div><div className="pi-v">{brand.audience}</div></div>
                <div className="profile-item"><div className="pi-k">Monthly Budget</div><div className="pi-v">{brand.budget}</div></div>
                <div className="profile-item"><div className="pi-k">Competitors</div><div className="chip-row">{brand.competitors.map(c=><span key={c} className="chip">{c}</span>)}</div></div>
                <div className="profile-item" style={{gridColumn:"1 / -1"}}><div className="pi-k">Their Challenge</div><div className="pi-v">{brand.challenge}</div></div>
              </div>
              <div className="nav-row">
                <button className="btn btn-ghost" onClick={rerollRandom}>🎲 Different Client</button>
                <button className="btn btn-primary" onClick={()=>goTo(3)}>Continue →</button>
              </div>
            </>
          )}

          {mode === "own" && brand && (
            <>
              <p className="lede">Fill this in like a real client intake form — the more specific, the better your strategy will be.</p>
              <div className="form-grid">
                <div className="field"><label>Business Name</label><input value={brand.name} onChange={e=>updateBrand("name", e.target.value)} placeholder="e.g. Northside Bakery" /></div>
                <div className="field"><label>Industry Type</label>
                  <select value={brand.industryType} onChange={e=>updateBrand("industryType", e.target.value)}>
                    {INDUSTRY_TYPES.map(it=><option key={it.id} value={it.id}>{it.label}</option>)}
                  </select>
                </div>
                <div className="field full"><label>Target Audience</label><textarea value={brand.audience} onChange={e=>updateBrand("audience", e.target.value)} placeholder="Who are they? Age, lifestyle, what they care about..." /></div>
                <div className="field"><label>Monthly Marketing Budget</label>
                  <select value={brand.budget} onChange={e=>updateBrand("budget", e.target.value)}>
                    {BUDGET_TIERS.map(b=><option key={b} value={b}>{b}</option>)}
                  </select>
                </div>
                <div className="field"><label>Main Competitors</label><input value={brand.competitors} onChange={e=>updateBrand("competitors", e.target.value)} placeholder="Comma separated" /></div>
                <div className="field full"><label>Biggest Marketing Challenge Right Now</label><textarea value={brand.challenge} onChange={e=>updateBrand("challenge", e.target.value)} placeholder="What's not working?" /></div>
              </div>
              <div className="nav-row">
                <button className="btn btn-ghost" onClick={()=>goTo(1)}>← Back</button>
                <button className="btn btn-primary" disabled={!brand.name || !brand.audience} onClick={()=>goTo(3)}>Continue →</button>
              </div>
            </>
          )}

          {mode === "personal" && brand && (
            <>
              <p className="lede">Here, <b>you</b> are the brand. Your expertise is the product and your story is the differentiator.</p>
              <div className="form-grid">
                <div className="field"><label>Your Name</label><input value={brand.name} onChange={e=>updateBrand("name", e.target.value)} placeholder="e.g. Jordan Reyes" /></div>
                <div className="field"><label>Your Niche / Expertise</label><input value={brand.niche} onChange={e=>updateBrand("niche", e.target.value)} placeholder="e.g. UX design for fintech" /></div>
                <div className="field full"><label>Your Story / Background</label><textarea value={brand.story} onChange={e=>updateBrand("story", e.target.value)} placeholder="What's your path here? What makes your perspective different?" /></div>
                <div className="field"><label>Weekly Time You Can Invest</label>
                  <select value={brand.time} onChange={e=>updateBrand("time", e.target.value)}>
                    {TIME_TIERS.map(t=><option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
                <div className="field"><label>People You Admire In Your Space</label><input value={brand.admired} onChange={e=>updateBrand("admired", e.target.value)} placeholder="Comma separated" /></div>
              </div>
              <div className="nav-row">
                <button className="btn btn-ghost" onClick={()=>goTo(1)}>← Back</button>
                <button className="btn btn-primary" disabled={!brand.name || !brand.niche} onClick={()=>goTo(3)}>Continue →</button>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  /* ---------- STAGE 3: UNDERSTAND AUDIENCE ---------- */
  if(stage === 3){
    const isPersonal = mode === "personal";
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 3 · Understand the {isPersonal ? "brand (you)" : "business & audience"}</p>
          <h2 className="section-title">Before any content, understand who you're talking to.</h2>
          <TeachBox
            what={isPersonal
              ? "Your 'product' is your expertise and story. Your audience is whoever needs that expertise or connects with that story."
              : "Every business has a product, a specific audience, and constraints (budget, competitors). Strategy starts by mapping all three honestly."}
            why="Marketers who skip this step create content that looks nice but talks to no one in particular. The strategy fails before a single post goes out."
          />

          <div className="profile-grid">
            <div className="profile-item"><div className="pi-k">{isPersonal ? "Name" : "Business"}</div><div className="pi-v">{brand.name}</div></div>
            <div className="profile-item"><div className="pi-k">{isPersonal ? "Expertise (your product)" : "Industry"}</div><div className="pi-v">{isPersonal ? brand.niche : brand.industryLabel || INDUSTRY_TYPES.find(i=>i.id===brand.industryType).label}</div></div>
            <div className="profile-item" style={{gridColumn:"1 / -1"}}>
              <div className="pi-k">{isPersonal ? "Story" : "Audience"}</div>
              <div className="pi-v">{isPersonal ? (brand.story || "—") : brand.audience}</div>
            </div>
            <div className="profile-item"><div className="pi-k">{isPersonal ? "Time Available" : "Budget"}</div><div className="pi-v">{isPersonal ? brand.time : brand.budget}</div></div>
            <div className="profile-item">
              <div className="pi-k">{isPersonal ? "People You Admire" : "Competitors"}</div>
              <div className="chip-row">
                {(isPersonal ? (brand.admired||"").split(",") : (Array.isArray(brand.competitors)? brand.competitors : (brand.competitors||"").split(",")))
                  .map(c=>c.trim()).filter(Boolean).map(c=><span key={c} className="chip">{c}</span>)}
                {(isPersonal ? !brand.admired : !brand.competitors) && <span className="chip">—</span>}
              </div>
            </div>
            {!isPersonal && <div className="profile-item" style={{gridColumn:"1 / -1"}}><div className="pi-k">Challenge</div><div className="pi-v">{brand.challenge || "—"}</div></div>}
          </div>

          <div className="claude-card" style={{marginTop:18, border:"1px solid var(--border)"}}>
            <h3 className="card-title" style={{marginBottom:6}}>Strategist's read</h3>
            <p style={{fontSize:13.5, color:"var(--muted)", margin:0}}>
              {isPersonal
                ? `${brand.name || "This person"}'s audience isn't "everyone interested in ${brand.niche || "this topic"}" — it's the narrower group who needs this expertise applied to their specific situation. The people they admire (${(brand.admired||"peers in the space")}) show what "good" looks like structurally, not what to copy.`
                : `${brand.name || "This business"}'s real audience is narrower than "everyone who could use the product" — it's the specific group described above, with a specific challenge: ${brand.challenge || "unclear differentiation"}. Competitors like ${(Array.isArray(brand.competitors)?brand.competitors.join(", "):brand.competitors)||"others in the space"} define the baseline; the strategy must clear that bar, not just look nice on its own.`}
            </p>
          </div>

          <AskClaudeCard prompt={isPersonal
            ? `Act as a personal branding strategist. My name is ${brand.name || "[name]"}, my niche is ${brand.niche || "[niche]"}, and my background is: ${brand.story || "[your story]"}. Help me define exactly who my audience is and what they need from someone with my expertise.`
            : `Act as a marketing strategist. My business is ${brand.name || "[business name]"} in the ${brand.industryLabel || "[industry]"} space. My audience is: ${brand.audience || "[describe audience]"}. My biggest challenge is: ${brand.challenge || "[describe challenge]"}. Help me sharpen my understanding of this audience before I plan any content.`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(2)}>← Back</button>
            <button className="btn btn-primary" onClick={()=>goTo(4)}>Continue to Platforms →</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 4: PLATFORMS ---------- */
  if(stage === 4){
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 4 · Choose your platforms</p>
          <h2 className="section-title">Not every platform deserves your time.</h2>
          <TeachBox
            what="Each platform has a different algorithm, audience behavior and content format. 'Fit' means how naturally your audience already behaves there."
            why="Spreading effort across every platform equally is one of the most common beginner mistakes — it guarantees mediocrity everywhere instead of strength somewhere."
          />
          <div className="platform-grid">
            {PLATFORMS.map(p=>{
              const fit = getFit(p.id, mode, industryType);
              const reason = getFitReason(p.id, mode, industryType);
              const selected = selectedPlatforms.includes(p.id);
              return (
                <div key={p.id} className={"platform-card" + (selected ? " selected":"")} onClick={()=>togglePlatform(p.id)}>
                  {selected && <span className="stamp">CHOSEN</span>}
                  <div className="platform-head">
                    <span className="platform-name">{p.icon} {p.name}</span>
                    <span className={"fit-badge fit-"+fit}>{fit} fit</span>
                  </div>
                  <p>{p.blurb}</p>
                  <div className="platform-reason">{reason}</div>
                </div>
              );
            })}
          </div>

          <AskClaudeCard prompt={mode === "personal"
            ? `I'm building a personal brand as ${brand.name || "[name]"} in ${brand.niche || "[niche]"}. Given that I can invest ${brand.time}, help me decide which 2-3 platforms deserve most of my time, and explain the trade-offs of each.`
            : `My business, ${brand.name || "[business]"}, is a ${brand.industryLabel || "[industry]"} brand with a ${brand.budget || "[budget]"} monthly budget. Help me choose which social platforms are worth focused investment right now, and which ones I should deliberately ignore for now.`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(3)}>← Back</button>
            <button className="btn btn-primary" disabled={selectedPlatforms.length===0} onClick={()=>goTo(5)}>
              Continue with {selectedPlatforms.length} platform{selectedPlatforms.length===1?"":"s"} →
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 5: PILLARS ---------- */
  if(stage === 5){
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 5 · Choose your content pillars</p>
          <h2 className="section-title">Pick exactly 3 pillars. No more.</h2>
          <TeachBox
            what="A content pillar is a recurring theme that shows up again and again — it's not a single post, it's a category your whole content plan orbits around."
            why="Trying to do everything at once (educate AND entertain AND sell AND go behind-the-scenes) makes a brand feel scattered. Three focused pillars is enough to be consistent and distinct."
          />
          <div className="pillar-grid">
            {pillarSource.map(p=>{
              const selected = selectedPillars.includes(p.id);
              const locked = !selected && selectedPillars.length>=3;
              return (
                <div key={p.id} className={"pillar-card" + (selected?" selected":"") + (locked?" locked":"")} onClick={()=>{ if(!locked) togglePillar(p.id); }}>
                  {selected && <span className="stamp" style={{background:"var(--teal)", color:"#04211c"}}>PICKED</span>}
                  <div>
                    <div className="pillar-goal">Builds → {p.goal}</div>
                    <div className="pillar-name">{p.name}</div>
                    <p className="pillar-desc">{p.desc}</p>
                  </div>
                </div>
              );
            })}
          </div>
          <p className="pick-counter">{selectedPillars.length} / 3 selected</p>

          <AskClaudeCard prompt={mode === "personal"
            ? `I'm building a personal brand around ${brand.niche || "[niche]"}. Here are my three chosen content pillars: [list your 3 pillars]. Help me generate 5 specific post ideas for each pillar that stay true to my niche and story.`
            : `My brand ${brand.name || "[business]"} is focused on these three content pillars: [list your 3 pillars]. Help me generate 5 specific post ideas per pillar that speak directly to this audience: ${brand.audience || "[audience]"}.`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(4)}>← Back</button>
            <button className="btn btn-primary" disabled={selectedPillars.length!==3} onClick={goToRoadmap}>Build the Roadmap →</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 6: ROADMAP ---------- */
  if(stage === 6){
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 6 · Plan the first 30 days</p>
          <h2 className="section-title">Strategy is weekly goals, not a stack of individual posts.</h2>
          <TeachBox
            what="A real content roadmap sets a goal per week (what it should accomplish), not a script of exactly what to post each day."
            why="Beginners plan individual posts and burn out. Strategists plan objectives — the specific posts can flex, but the direction stays locked."
          />
          <div className="week-list">
            {roadmap.map(w=>(
              <div key={w.num} className="week-card">
                <div className="week-head">
                  <span className="week-num">{w.num}</span>
                  <span className="week-title">{w.title}</span>
                </div>
                <p className="week-goal">Goal: {w.goal}</p>
                <ul>{w.bullets.map((b,i)=><li key={i}>{b}</li>)}</ul>
              </div>
            ))}
          </div>

          <AskClaudeCard prompt={mode === "personal"
            ? `Help me turn this 4-week roadmap into a specific week-by-week content calendar for my personal brand as ${brand.name || "[name]"} in ${brand.niche || "[niche]"}: [paste the 4 weekly goals]. Suggest 2-3 concrete post ideas per week.`
            : `Help me turn this 4-week marketing roadmap into a specific content calendar for ${brand.name || "[business]"}: [paste the 4 weekly goals]. Suggest 2-3 concrete post ideas per week that fit our chosen platforms and pillars.`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(5)}>← Back</button>
            <button className="btn btn-primary" onClick={goToEvent}>Continue: A Curveball Hits →</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 7: EVENT ---------- */
  if(stage === 7 && activeEvent){
    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 7 · Handle the unexpected</p>
          <h2 className="section-title">Plans survive contact with reality — barely.</h2>
          <TeachBox
            what="A marketing curveball is any unplanned event — good or bad — that forces a real-time decision outside your roadmap."
            why="This is where strategists earn their title. Anyone can plan a calendar; the job is judgment under pressure, with incomplete information and a ticking clock."
          />
          <div className="event-card">
            <span className="event-tag">Live situation</span>
            <h3 className="card-title" style={{fontSize:18}}>{activeEvent.title}</h3>
            <p style={{color:"var(--muted)", fontSize:14}}>{activeEvent.description}</p>
            <div className="event-options">
              {activeEvent.options.map((opt,i)=>(
                <button key={i} className={"option-btn"+(chosenOption===opt?" chosen":"")} onClick={()=>setChosenOption(opt)}>
                  <span className="ob-label">{opt.label}</span>
                </button>
              ))}
            </div>
            {chosenOption && (
              <div className="consequence-box">
                <span className="cb-label">What happens next</span>
                <p style={{margin:0, fontSize:13.5}}>{chosenOption.consequence}</p>
              </div>
            )}
          </div>

          <AskClaudeCard prompt={mode === "personal"
            ? `As a personal brand strategist, help me think through how to respond to this situation: "${activeEvent.title} — ${activeEvent.description}". What are the risks and upsides of different responses for someone building a brand around ${brand.niche || "[niche]"}?`
            : `As a marketing strategist, help me think through how to respond to this situation for ${brand.name || "[business]"}: "${activeEvent.title} — ${activeEvent.description}". What are the risks and upsides of different responses?`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(6)}>← Back</button>
            <button className="btn btn-primary" disabled={!chosenOption} onClick={()=>goTo(8)}>See the Growth Report →</button>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- STAGE 8: REPORT ---------- */
  if(stage === 8){
    const isPersonal = mode === "personal";
    const pillarNames = selectedPillars.map(id=>pillarSource.find(p=>p.id===id).name);
    const platformNames = selectedPlatforms.map(id=>PLATFORMS.find(p=>p.id===id).name);

    const lessons = isPersonal ? [
      `Authenticity beats polish: the pillars you picked (${pillarNames.join(", ")}) only work if they sound like you, not a generic version of a "personal brand."`,
      `Consistency compounds: your Week 1 foundation (POV + bio) only pays off if Weeks 2-4 keep showing up in that same voice.`,
      `Niche clarity attracts the right people faster than broad appeal attracts the wrong ones — a smaller, specific audience converts better than a big, vague one.`,
    ] : [
      `Audience specificity beats reach: knowing exactly who ${brand.name} is talking to made every later decision (platforms, pillars) easier and sharper.`,
      `Platform fit beats platform hype: choosing ${platformNames.join(", ")} based on real audience behavior — not trends — protects limited time and budget.`,
      `A plan is only as strong as its response to pressure: how you handled the curveball reveals whether the strategy was actually understood or just memorized.`,
    ];

    return (
      <div className="shell">
        <TopBar />
        <Stepper stageIndex={stage} />
        <div className="card">
          <p className="eyebrow">Step 8 · The Growth Report</p>
          <h2 className="section-title">Here's the full strategic picture for {brandDisplayName}.</h2>

          <div className="report-item wide" style={{marginTop:6}}>
            <h4>Growth Potential</h4>
            <div className="score-wrap">
              <div className="score-num">{scoreInfo.score}</div>
              <div style={{flex:1}}>
                <div className="score-bar-track"><div className="score-bar-fill" style={{width:scoreInfo.score+"%"}}></div></div>
                <p style={{margin:"6px 0 0", fontSize:13, color:"var(--muted)"}}>{scoreInfo.label} — based on platform fit and how the curveball was handled.</p>
              </div>
            </div>
          </div>

          <div className="report-grid">
            <div className="report-item">
              <h4>Audience Understanding</h4>
              <p>{isPersonal
                ? `${brand.name}'s audience follows for expertise in ${brand.niche || "their niche"}, shaped by a story worth: ${(brand.story||"a clear personal journey").slice(0,140)}${(brand.story||"").length>140?"…":""}`
                : `${brand.name}'s audience is defined narrowly around: ${brand.audience.slice(0,150)}${brand.audience.length>150?"…":""}`}</p>
            </div>
            <div className="report-item">
              <h4>Platform Strategy</h4>
              <p>Focused on {platformNames.join(", ") || "no platforms selected"} — chosen for behavioral fit with this specific audience, not general popularity.</p>
            </div>
            <div className="report-item">
              <h4>Content Strategy</h4>
              <p>Built around three pillars: {pillarNames.join(", ") || "—"}. Each pulls a different lever — trust, reach, proof, or connection — instead of trying to do everything at once.</p>
            </div>
            <div className="report-item">
              <h4>Best Decision</h4>
              <p>{bw.bestText}</p>
            </div>
            <div className="report-item">
              <h4>Biggest Mistake</h4>
              <p>{bw.mistakeText}</p>
            </div>
            <div className="report-item">
              <h4>Curveball Response</h4>
              <p>{chosenOption ? chosenOption.consequence : "No event resolved."}</p>
            </div>
            <div className="report-item wide">
              <h4>Three Marketing Lessons</h4>
              <ul className="lessons-list">{lessons.map((l,i)=><li key={i}>{l}</li>)}</ul>
            </div>
          </div>

          <AskClaudeCard prompt={isPersonal
            ? `Act as a personal branding coach. Here's my growth report: audience is people who want ${brand.niche || "[niche]"} expertise, platforms are ${platformNames.join(", ")||"[platforms]"}, pillars are ${pillarNames.join(", ")||"[pillars]"}. Help me turn this into a real 90-day personal brand plan.`
            : `Act as a marketing strategist. Here's my brand's growth report: audience is ${brand.audience||"[audience]"}, platforms are ${platformNames.join(", ")||"[platforms]"}, pillars are ${pillarNames.join(", ")||"[pillars]"}. Help me turn this into a real 90-day marketing plan with measurable goals.`}
          />

          <div className="nav-row">
            <button className="btn btn-ghost" onClick={()=>goTo(7)}>← Back</button>
            <button className="btn btn-primary" onClick={resetAll}>🔁 Replay With a New Brand</button>
          </div>
        </div>
        <p className="footer-note">You just made the same decisions a marketing strategist makes on day one of any account.</p>
      </div>
    );
  }

  return null;
}

function TopBar(){
  return (
    <div className="topbar">
      <div className="brandmark">
        <div className="mark">MS</div>
        <div><h1>Marketing Strategist Trainer</h1><p>a decision-based learning simulation</p></div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
