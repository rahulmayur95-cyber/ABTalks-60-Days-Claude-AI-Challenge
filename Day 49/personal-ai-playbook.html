<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Workbench — Your Personal AI Playbook</title>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#FAF9F6;
  --paper-raised:#FFFFFF;
  --ink:#1C1F26;
  --ink-soft:#4A4F5B;
  --ink-faint:#8A8F9B;
  --line:#E3E1DA;
  --line-strong:#CBC8BE;
  --steel:#2B4C7E;
  --steel-deep:#1D3557;
  --steel-tint:#EAF0FA;
  --gold:#B8912A;
  --gold-tint:#FBF3DE;
  --teal:#3A7D6B;
  --teal-tint:#E6F2EE;
  --danger:#B23A48;
  --danger-tint:#FBEAEC;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(28,31,38,0.06), 0 1px 1px rgba(28,31,38,0.04);
  --shadow-md:0 4px 16px rgba(28,31,38,0.08), 0 1px 3px rgba(28,31,38,0.06);
  --shadow-lg:0 12px 40px rgba(28,31,38,0.14), 0 4px 12px rgba(28,31,38,0.08);
  --font-display:'Fraunces Fallback', Georgia, 'Iowan Old Style', serif;
  --font-body:'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'JetBrains Mono Fallback', 'SFMono-Regular', Consolas, monospace;
  --dur-fast:120ms;
  --dur-med:220ms;
  --dur-slow:400ms;
  --ease: cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"]{
  --paper:#14171C;
  --paper-raised:#1C2027;
  --ink:#EDEEF0;
  --ink-soft:#B4B8C2;
  --ink-faint:#767C8A;
  --line:#2A2E37;
  --line-strong:#3A3F4A;
  --steel:#6E96D6;
  --steel-deep:#8FB0E4;
  --steel-tint:#1C2A3D;
  --gold:#E0B84B;
  --gold-tint:#2E2717;
  --teal:#5FB39C;
  --teal-tint:#16302A;
  --danger:#E17685;
  --danger-tint:#3A1C21;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
}

@font-face{ font-family:'Fraunces Fallback'; src:local('Georgia'); }
@font-face{ font-family:'Inter Fallback'; src:local('Helvetica Neue'), local('Arial'); }
@font-face{ font-family:'JetBrains Mono Fallback'; src:local('Menlo'), local('Consolas'); }

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  transition:background var(--dur-med) var(--ease), color var(--dur-med) var(--ease);
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; color:var(--ink);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--ink);}
a{color:var(--steel);}
::selection{background:var(--gold-tint); color:var(--ink);}
:focus-visible{outline:2px solid var(--steel); outline-offset:2px; border-radius:4px;}

.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* ============ LAYOUT SHELL ============ */
#app{display:flex; min-height:100vh;}

/* SIDEBAR */
#sidebar{
  width:236px; flex-shrink:0;
  background:var(--paper-raised);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  padding:20px 14px;
  transition:background var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease);
  z-index:20;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:4px 8px 20px 8px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.brand-mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg, var(--steel), var(--steel-deep));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-display); font-weight:700; font-size:15px;
  flex-shrink:0;
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-text strong{font-family:var(--font-display); font-size:15px; font-weight:600;}
.brand-text span{font-size:10.5px; color:var(--ink-faint); letter-spacing:0.03em; text-transform:uppercase;}

nav.primary-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:var(--radius-sm);
  color:var(--ink-soft); font-size:13.5px; font-weight:500;
  background:transparent; border:none; text-align:left; width:100%;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item:hover{background:var(--steel-tint); color:var(--ink);}
.nav-item.active{background:var(--steel-tint); color:var(--steel-deep); font-weight:600;}
.nav-item .nav-icon{width:17px; height:17px; flex-shrink:0; opacity:0.85;}
.nav-section-label{
  font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--ink-faint); margin:14px 10px 6px 10px; font-weight:600;
}
.sidebar-footer{display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--line);}

/* MAIN */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px; border-bottom:1px solid var(--line);
  background:var(--paper); position:sticky; top:0; z-index:15;
  backdrop-filter:blur(6px);
}
.topbar-left{display:flex; align-items:center; gap:14px;}
.topbar-title{font-family:var(--font-display); font-size:19px; font-weight:600;}
.topbar-subtitle{font-size:12.5px; color:var(--ink-faint); margin-top:1px;}
.topbar-right{display:flex; align-items:center; gap:8px;}

#content{flex:1; padding:24px 28px 60px 28px; max-width:1180px; width:100%; margin:0 auto;}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--line-strong); background:var(--paper-raised);
  color:var(--ink); font-size:13px; font-weight:500;
  transition:all var(--dur-fast) var(--ease);
}
.btn:hover{border-color:var(--steel); color:var(--steel-deep); transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--steel); border-color:var(--steel); color:#fff;}
.btn-primary:hover{background:var(--steel-deep); border-color:var(--steel-deep); color:#fff;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--steel-tint); border-color:transparent;}
.btn-icon{padding:8px; width:34px; height:34px; justify-content:center;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn-danger{color:var(--danger); border-color:var(--danger-tint);}
.btn-danger:hover{background:var(--danger-tint); border-color:var(--danger); color:var(--danger);}
svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}

/* ============ EXPLAINER BANNER ============ */
#explainer{
  background:linear-gradient(135deg, var(--steel-tint), var(--paper-raised));
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:20px 24px;
  margin-bottom:24px;
  display:flex; gap:18px; align-items:flex-start;
  position:relative;
  animation:fadeSlideIn var(--dur-slow) var(--ease);
}
#explainer .exp-icon{
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  background:var(--paper-raised); border:1px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center;
}
#explainer h3{font-size:16px; margin-bottom:4px;}
#explainer p{font-size:13.5px; color:var(--ink-soft); max-width:640px;}
#explainer .exp-grid{display:flex; gap:20px; margin-top:12px; flex-wrap:wrap;}
#explainer .exp-grid div{font-size:12.5px; color:var(--ink-soft);}
#explainer .exp-grid strong{color:var(--ink); display:block; font-size:13px; margin-bottom:2px;}
#explainer .close-explainer{position:absolute; top:14px; right:14px;}
@keyframes fadeSlideIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

/* ============ VIEW HEADER ============ */
.view-header{margin-bottom:20px;}
.view-header h2{font-size:24px; margin-bottom:4px;}
.view-header p{color:var(--ink-faint); font-size:13.5px;}

/* ============ CARDS / GRID ============ */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px;}
.card{
  background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius-md); padding:18px;
  transition:box-shadow var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  display:flex; flex-direction:column; gap:10px;
}
.card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--line-strong);}
.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.card-badge{
  display:inline-block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
  padding:3px 8px; border-radius:20px; background:var(--steel-tint); color:var(--steel-deep);
}
.card h4{font-size:15.5px; margin-bottom:2px;}
.card .card-desc{font-size:12.5px; color:var(--ink-soft); flex:1;}
.card-meta{display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--ink-faint); flex-wrap:wrap;}
.card-actions{display:flex; gap:6px; margin-top:4px;}
.fav-btn{background:none; border:none; padding:2px; color:var(--ink-faint); transition:color var(--dur-fast);}
.fav-btn.active{color:var(--gold);}
.fav-btn.active svg{fill:var(--gold);}
.fav-btn:hover{color:var(--gold);}

/* Dashboard stats */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:16px 18px;
}
.stat-card .stat-num{font-family:var(--font-display); font-size:28px; font-weight:600; color:var(--steel-deep);}
.stat-card .stat-label{font-size:12px; color:var(--ink-faint); margin-top:2px;}

/* Category rail */
.category-rail{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.chip{
  padding:6px 13px; border-radius:20px; border:1px solid var(--line-strong);
  background:var(--paper-raised); font-size:12.5px; color:var(--ink-soft); font-weight:500;
  transition:all var(--dur-fast) var(--ease);
}
.chip:hover{border-color:var(--steel);}
.chip.active{background:var(--steel); border-color:var(--steel); color:#fff;}

/* search/filter bar */
.toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
.search-box{
  flex:1; min-width:200px; display:flex; align-items:center; gap:8px;
  background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:8px 12px;
}
.search-box input{border:none; outline:none; background:transparent; width:100%; font-size:13.5px; color:var(--ink);}
.search-box svg{color:var(--ink-faint); flex-shrink:0;}
select.filter-select{
  padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--line-strong);
  background:var(--paper-raised); font-size:13px; color:var(--ink-soft);
}

/* empty state */
.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-faint);
  border:1.5px dashed var(--line-strong); border-radius:var(--radius-lg);
}
.empty-state svg{width:36px; height:36px; margin-bottom:12px; opacity:0.5;}
.empty-state h4{color:var(--ink-soft); font-size:15px; margin-bottom:4px; font-family:var(--font-body); font-weight:600;}
.empty-state p{font-size:13px; max-width:360px; margin:0 auto;}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,22,26,0.5); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  animation:fadeIn var(--dur-fast) var(--ease);
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal{
  background:var(--paper-raised); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:680px; max-height:88vh; overflow-y:auto;
  animation:modalPop var(--dur-med) var(--ease);
  border:1px solid var(--line);
}
.modal.wide{max-width:900px;}
@keyframes modalPop{from{opacity:0; transform:scale(0.97) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal-header{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding:20px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-raised); z-index:2;
}
.modal-header h3{font-size:18px;}
.modal-header p{font-size:12.5px; color:var(--ink-faint); margin-top:3px;}
.modal-body{padding:22px;}
.modal-footer{
  display:flex; justify-content:flex-end; gap:8px; padding:16px 22px;
  border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--paper-raised);
}

/* ============ FORM ELEMENTS ============ */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.field input[type=text], .field textarea, .field select{
  width:100%; padding:9px 12px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  background:var(--paper); font-size:13.5px; transition:border-color var(--dur-fast);
}
.field input[type=text]:focus, .field textarea:focus, .field select:focus{border-color:var(--steel);}
.field textarea{resize:vertical; min-height:80px; font-family:var(--font-mono); font-size:12.5px; line-height:1.6;}

/* ============ WORKFLOW DETAIL / TEMPLATE VIEW ============ */
.template-view{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden;}
.template-head{padding:22px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; align-items:flex-start;}
.template-head h3{font-size:19px; margin-bottom:4px;}
.template-head p{color:var(--ink-soft); font-size:13px; max-width:520px;}
.template-body{padding:22px 24px; display:grid; grid-template-columns:1fr 300px; gap:24px;}
@media (max-width:800px){.template-body{grid-template-columns:1fr;}}

.prompt-box{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:16px; font-family:var(--font-mono); font-size:12.5px; line-height:1.7; white-space:pre-wrap;
  color:var(--ink-soft); max-height:420px; overflow-y:auto;
}
.prompt-box .var-token{
  background:var(--gold-tint); color:var(--gold); padding:1px 5px; border-radius:4px; font-weight:600;
  border:1px solid rgba(184,145,42,0.3);
}
.var-panel h4{font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:10px;}
.var-item{margin-bottom:12px;}
.var-item label{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--steel-deep); margin-bottom:4px; font-family:var(--font-mono);}
.var-item input, .var-item select{
  width:100%; padding:7px 9px; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper); font-size:12.5px;
}
.best-practices{margin-top:16px; padding-top:16px; border-top:1px solid var(--line);}
.best-practices h4{font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:8px;}
.best-practices ul{padding-left:18px; font-size:12.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;}
.example-block{
  margin-top:16px; padding:12px 14px; background:var(--teal-tint); border-radius:var(--radius-sm);
  border-left:3px solid var(--teal); font-size:12.5px; color:var(--ink-soft);
}
.example-block strong{color:var(--teal); display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;}

/* ============ PROMPT BUILDER ============ */
.builder-layout{display:grid; grid-template-columns:340px 1fr; gap:20px;}
@media (max-width:900px){.builder-layout{grid-template-columns:1fr;}}
.block-picker{display:flex; flex-direction:column; gap:8px;}
.block-option{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:12px 14px; cursor:pointer; transition:all var(--dur-fast) var(--ease);
}
.block-option:hover{border-color:var(--steel); box-shadow:var(--shadow-sm);}
.block-option.added{opacity:0.45; pointer-events:none;}
.block-option-top{display:flex; align-items:center; justify-content:space-between;}
.block-option-top strong{font-size:13.5px;}
.block-option p{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.block-add-icon{
  width:22px; height:22px; border-radius:6px; background:var(--steel-tint); color:var(--steel-deep);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.assembled-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.assembled-block{
  background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius-md);
  padding:14px 16px; position:relative;
}
.assembled-block-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.assembled-block-head .tag{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--steel-deep);
  background:var(--steel-tint); padding:2px 8px; border-radius:10px;
}
.assembled-block-head .remove-block{color:var(--ink-faint); background:none; border:none; padding:2px;}
.assembled-block-head .remove-block:hover{color:var(--danger);}
.assembled-block .why{font-size:11px; color:var(--ink-faint); margin-bottom:8px; font-style:italic;}
.assembled-block textarea{
  width:100%; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12.5px;
  font-family:var(--font-mono); background:var(--paper); min-height:54px; resize:vertical;
}

.preview-panel{
  position:sticky; top:80px; background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-sm);
}
.preview-panel h4{font-size:12.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:10px;}
.preview-text{
  font-family:var(--font-mono); font-size:12px; line-height:1.7; white-space:pre-wrap; color:var(--ink-soft);
  max-height:340px; overflow-y:auto; margin-bottom:14px; padding-right:4px;
}
.preview-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* Loop builder specific */
.loop-steps{display:flex; flex-direction:column; gap:18px;}
.loop-step{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px 20px;}
.loop-step-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.loop-step-num{
  width:24px; height:24px; border-radius:50%; background:var(--steel); color:#fff; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:var(--font-mono);
}
.loop-step-head strong{font-size:14.5px;}
.loop-step p.desc{font-size:12px; color:var(--ink-faint); margin:4px 0 12px 34px; max-width:560px;}
.loop-step .step-body{margin-left:34px;}

/* toast */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--radius-sm);
  font-size:13px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:all var(--dur-med) var(--ease);
  z-index:200; display:flex; align-items:center; gap:8px;
}
[data-theme="dark"] #toast{background:var(--paper-raised); color:var(--ink); border:1px solid var(--line-strong);}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast svg{color:var(--teal); width:15px; height:15px;}

/* onboarding */
.onboard-overlay{position:fixed; inset:0; background:rgba(20,22,26,0.55); display:flex; align-items:center; justify-content:center; z-index:300; padding:20px;}
.onboard-modal{background:var(--paper-raised); border-radius:var(--radius-lg); max-width:520px; width:100%; box-shadow:var(--shadow-lg); overflow:hidden;}
.onboard-hero{padding:32px 28px 20px 28px; background:linear-gradient(160deg, var(--steel-tint), var(--paper-raised));}
.onboard-hero h2{font-size:22px; margin-bottom:8px;}
.onboard-hero p{font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
.onboard-list{padding:20px 28px; display:flex; flex-direction:column; gap:14px;}
.onboard-list-item{display:flex; gap:12px; align-items:flex-start;}
.onboard-list-item .num{width:22px; height:22px; border-radius:6px; background:var(--gold-tint); color:var(--gold); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:var(--font-mono);}
.onboard-list-item strong{font-size:13.5px; display:block; margin-bottom:2px;}
.onboard-list-item span{font-size:12.5px; color:var(--ink-faint);}
.onboard-footer{padding:18px 28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}

/* keyboard shortcuts modal */
.kbd{
  display:inline-flex; align-items:center; justify-content:center; min-width:22px; padding:2px 6px;
  background:var(--paper); border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:5px;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
}
.shortcut-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
.shortcut-row:last-child{border-bottom:none;}
.shortcut-keys{display:flex; gap:4px;}

/* helper text used across app for "what does this mean" first-use tags */
.term-def{
  font-size:11px; color:var(--ink-faint); background:var(--paper); border:1px dashed var(--line-strong);
  padding:6px 10px; border-radius:6px; margin-top:6px; display:inline-flex; gap:6px; align-items:flex-start;
}

/* scrollbar */
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}

/* responsive */
@media (max-width:820px){
  #sidebar{position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%); transition:transform var(--dur-med) var(--ease); box-shadow:var(--shadow-lg);}
  #sidebar.open{transform:translateX(0);}
  #topbar{padding:12px 16px;}
  #content{padding:18px 16px 50px 16px;}
  .mobile-menu-btn{display:flex !important;}
  .template-body{grid-template-columns:1fr;}
}
.mobile-menu-btn{display:none;}
#sidebar-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:19; display:none;}
#sidebar-backdrop.show{display:block;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ SIDEBAR ============ -->

  <aside id="sidebar">
    <div class="brand">

        Loop Builder
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item" onclick="openHelp()">
        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><path d="M12 17.5v.01"/></svg>
        What is this?
      </button>
      <button class="nav-item" onclick="openShortcuts()">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
        Keyboard shortcuts
      </button>
      <button class="nav-item" id="themeToggle" onclick="toggleTheme()">
        <svg class="nav-icon" viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Dark mode</span>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <button class="btn btn-icon mobile-menu-btn" onclick="openMobileSidebar()" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div>
          <div class="topbar-title" id="topbarTitle">Dashboard</div>
          <div class="topbar-subtitle" id="topbarSubtitle">Your saved AI workflows, at a glance</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-sm" onclick="exportData()">

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   DATA MODEL
   ========================================================================= */

const STORAGE_KEY = 'workbench_data_v1';
const ONBOARD_KEY = 'workbench_onboarded_v1';
const EXPLAINER_KEY = 'workbench_explainer_dismissed_v1';
const THEME_KEY = 'workbench_theme_v1';

// ---- Building block library (definitions shown in picker + when in use) ----
const BLOCK_LIBRARY = {
  role: {
    label:'Role', tag:'Role',
    why:"Tells the AI what persona or expertise to adopt. This shapes vocabulary, priorities, and depth — a 'senior ops consultant' answers differently than a 'generic assistant'.",
    placeholder:'e.g. You are a senior business operations consultant with 10+ years advising mid-size companies on process efficiency.'
  },
  objective: {
    label:'Objective', tag:'Objective',
    why:"States the single, concrete outcome you want. Vague objectives produce vague answers — be specific about the deliverable.",
    placeholder:'e.g. Analyze this dataset and identify the top 3 cost-saving opportunities.'
  },
  context: {
    label:'Context', tag:'Context',
    why:"Gives the AI background it can't guess — your industry, audience, prior decisions, or constraints already in play. Missing context is the #1 cause of generic output.",
    placeholder:'e.g. This is for a Q3 board update at a 40-person logistics company. The board is financially literate but not technical.'
  },
  constraints: {
    label:'Constraints', tag:'Constraints',
    why:"Sets hard limits — length, format, things to avoid, tone boundaries. Constraints prevent the AI from wandering off scope.",
    placeholder:'e.g. Keep it under 400 words. No jargon. Do not suggest layoffs as an option.'
  },
  reasoning: {
    label:'Reasoning strategy', tag:'Reasoning',
    why:"Tells the AI *how* to think before answering — step by step, compare options, weigh pros/cons. This produces more rigorous, less shallow output, especially for analysis or decisions.",
    placeholder:'e.g. Think step by step: first list assumptions, then analyze each option against the criteria, then recommend one.'
  },
  output_format: {
    label:'Output format', tag:'Format',
    why:"Specifies exactly how the response should be structured — table, bullet list, memo, JSON. This saves you from manually reformatting AI output every time.",
    placeholder:'e.g. Respond as a table with columns: Option, Pros, Cons, Estimated Cost, Recommendation.'
  },
  tone: {
    label:'Tone', tag:'Tone',
    why:"Calibrates the voice — formal, casual, persuasive, neutral. Matching tone to audience means less rewriting after the fact.",
    placeholder:'e.g. Professional but warm, confident without being salesy.'
  },
  examples: {
    label:'Examples', tag:'Examples',
    why:"Shows the AI a sample of the style or structure you want (few-shot prompting). One good example often teaches better than three sentences of instruction.",
    placeholder:'e.g. Here is an example of a summary I liked: [paste a past output you want to match].'
  },
  quality_check: {
    label:'Quality check', tag:'QC',
    why:"Asks the AI to self-review its own answer against your criteria before finalizing — catches errors, missed constraints, or weak reasoning before you see them.",
    placeholder:'e.g. Before finalizing, check: did I address every option? Did I stay under the word limit? Is the recommendation clearly justified?'
  }
};

// ---- Prebuilt workflow templates, organized by category ----
const CATEGORY_META = {
  research: {label:'Research & Summaries', icon:'search', desc:'Turn scattered sources into decision-ready briefs.'},
  data: {label:'Data & Spreadsheets', icon:'bars', desc:'Clean, analyze, and explain data without touching a pivot table by hand.'},
  strategy: {label:'Strategy & Decisions', icon:'compass', desc:'Structure fuzzy problems into clear options and recommendations.'},
  writing: {label:'Writing & Communication', icon:'pen', desc:'Draft client- and stakeholder-ready writing in your voice, fast.'}
};

function defaultWorkflows(){
  return [
    // RESEARCH
    {
      id:'wf-research-brief', category:'research', builtin:true, favorite:true,
      title:'Market / Competitor Research Brief',
      desc:'Turn a pile of articles, reports, or notes into a structured, decision-ready research brief.',
      tags:['research','summary','competitive'],
      template:`You are a senior research analyst preparing a briefing for a business decision-maker.

OBJECTIVE: Summarize the source material below into a decision-ready brief on {{research_topic}}.

CONTEXT: This is for {{audience}}, who needs to {{decision_purpose}}. They have limited time — assume a 5-minute read.

SOURCE MATERIAL:
{{source_material}}

REASONING STRATEGY: First extract the 5-7 most decision-relevant facts. Then group them into themes. Then identify what's uncertain or conflicting across sources. Only after that, draft the brief.

OUTPUT FORMAT:
1. Executive summary (3 sentences max)
2. Key findings (bulleted, grouped by theme)
3. Notable disagreements or gaps in the sources
4. Suggested next step

CONSTRAINTS: Do not editorialize beyond what the sources support. Flag any claim you're not confident about. Keep total length under {{max_length}}.

QUALITY CHECK: Before finalizing, confirm every key finding is traceable to the source material, and that the executive summary alone would let a busy exec act.`,
      variables:[
        {key:'research_topic', label:'Research topic', type:'text', placeholder:'e.g. competitor pricing models'},
        {key:'audience', label:'Audience', type:'select', options:['Executive leadership','Client / external stakeholder','My internal team','Myself, for a decision']},
        {key:'decision_purpose', label:'Decision this feeds into', type:'text', placeholder:'e.g. decide whether to enter a new market'},
        {key:'source_material', label:'Paste source material / notes', type:'textarea', placeholder:'Paste articles, notes, links, or raw findings here...'},
        {key:'max_length', label:'Max length', type:'select', options:['1 page','2 pages','300 words','500 words','No strict limit']}
      ],
      practices:[
        'Paste raw, messy notes — the AI is good at finding structure, don\'t pre-organize for it.',
        'Always ask for a "disagreements or gaps" section — it stops the AI from smoothing over contradictions.',
        'Set the audience precisely; a brief for a board reads nothing like one for your own use.'
      ],
      example:'Used for: summarizing 6 competitor pricing pages before a client pricing strategy session. Output was a 1-page brief with a pricing comparison table and 3 flagged inconsistencies to verify manually.'
    },
    {
      id:'wf-lit-scan', category:'research', builtin:true, favorite:false,
      title:'Quick Topic Scan (Explain + Sources to Check)',
      desc:'Get oriented on an unfamiliar topic fast, with a map of what to verify yourself.',
      tags:['research','onboarding'],
      template:`ROLE: You are a knowledgeable generalist who is excellent at orienting someone new to a topic quickly and honestly.

OBJECTIVE: Give me a working understanding of {{topic}} so I can {{purpose}}.

OUTPUT FORMAT:
- Plain-language overview (5-8 sentences)
- The 3-4 things practitioners in this space actually argue about or disagree on
- Key terms I should know (short glossary)
- What I should verify with a live source before relying on this (your knowledge may be outdated)

TONE: Direct, no fluff, comfortable saying "this is contested" or "I'm not fully sure" rather than sounding falsely confident.

CONSTRAINTS: Do not present contested claims as settled fact.`,
      variables:[
        {key:'topic', label:'Topic', type:'text', placeholder:'e.g. carbon credit markets'},
        {key:'purpose', label:'What you need it for', type:'text', placeholder:'e.g. speak intelligently in a client meeting tomorrow'}
      ],
      practices:[
        'Great for the 20 minutes before a meeting on an unfamiliar topic.',
        'Always follow up by asking the AI to search the web if your tool supports it, for anything time-sensitive.'
      ],
      example:'Used for: getting oriented on a client\'s industry regulations the night before a kickoff call.'
    },
    // DATA
    {
      id:'wf-data-cleanup', category:'data', builtin:true, favorite:true,
      title:'Spreadsheet Cleanup Instructions',
      desc:'Describe messy data once and get a precise, repeatable cleanup plan — or formulas — instead of doing it by hand.',
      tags:['data','excel','cleanup'],
      template:`ROLE: You are a data analyst who specializes in cleaning messy spreadsheet data efficiently and safely (without silently discarding information).

OBJECTIVE: Produce a step-by-step cleanup plan for the dataset described below, ready for me to apply in {{tool}}.

CONTEXT: 
- Data description: {{data_description}}
- Known issues: {{known_issues}}
- What "clean" needs to look like: {{clean_definition}}

REASONING STRATEGY: First list every issue you can infer from the description. Then, for each issue, propose the specific fix (formula, function, or manual step). Flag anything that requires a judgment call from me rather than guessing.

OUTPUT FORMAT: A numbered checklist. For each step: the issue, the fix (with exact formula/function if applicable), and why it matters.

CONSTRAINTS: Never assume how to handle missing or ambiguous data without flagging it. Prefer non-destructive fixes (new column) over overwriting original data where relevant.

QUALITY CHECK: Re-read your checklist as if you were the one applying it blind — is every step unambiguous and executable?`,
      variables:[
        {key:'tool', label:'Tool', type:'select', options:['Excel','Google Sheets','Python (pandas)','SQL']},
        {key:'data_description', label:'What the dataset contains', type:'textarea', placeholder:'e.g. 3 years of expense records, ~4000 rows, columns: date, vendor, amount, category, notes'},
        {key:'known_issues', label:'Known issues', type:'textarea', placeholder:'e.g. inconsistent date formats, duplicate vendor names spelled differently, some blank amounts'},
        {key:'clean_definition', label:'What "clean" means here', type:'text', placeholder:'e.g. one row per transaction, standardized vendor names, no blanks in amount'}
      ],
      practices:[
        'Paste a few real sample rows (with sensitive data removed) instead of just describing — precision goes up a lot.',
        'Ask for formulas *and* the reasoning, so you can sanity-check before running them on real data.',
        'For recurring monthly cleanups, save this as a workflow with the variables pre-filled for your standard file.'
      ],
      example:'Used for: monthly expense report cleanup — turned a 40-minute manual task into a 5-minute review-and-apply.'
    },
    {
      id:'wf-data-insights', category:'data', builtin:true, favorite:true,
      title:'Data-to-Insights Translator',
      desc:'Turn a table of numbers into plain-language business insights and a recommended action.',
      tags:['data','analysis','insights'],
      template:`ROLE: You are a business analyst skilled at translating raw numbers into insights a non-technical stakeholder can act on.

OBJECTIVE: Analyze the data below and produce insights relevant to {{business_question}}.

DATA:
{{data_input}}

REASONING STRATEGY: Think step by step — first identify notable patterns, outliers, or trends. Then consider alternative explanations for each pattern (don't jump to the first story). Then rank findings by business relevance to the question above.

OUTPUT FORMAT:
- Top 3 insights (plain language, no stats jargon), each with the supporting number
- One thing that surprised you or seems worth double-checking
- A recommended next action

TONE: {{tone}}

CONSTRAINTS: Do not state a causal claim unless the data actually supports causation, not just correlation — flag the difference explicitly.`,
      variables:[
        {key:'business_question', label:'Business question you\'re trying to answer', type:'text', placeholder:'e.g. why did Q2 churn increase?'},
        {key:'data_input', label:'Paste your data (table, CSV snippet, or summary numbers)', type:'textarea', placeholder:'Paste data here...'},
        {key:'tone', label:'Tone', type:'select', options:['Plain and direct','Executive-ready / polished','Casual, like explaining to a colleague']}
      ],
      practices:[
        'Always state the business question explicitly — "analyze this data" alone gives generic output.',
        'Push back if the AI states correlation as causation; ask it to re-check its own claim.',
        'Pair with the Prompt Builder\'s "Reasoning strategy" block if you want deeper step-by-step analysis.'
      ],
      example:'Used for: explaining a churn spike to a client from a raw CSV export, producing 3 clear talking points for the next call.'
    },
    // STRATEGY
    {
      id:'wf-decision-matrix', category:'strategy', builtin:true, favorite:true,
      title:'Structured Decision Analysis',
      desc:'Turn a fuzzy decision with multiple options into a structured, defensible comparison.',
      tags:['strategy','decision','options'],
      template:`ROLE: You are a strategy consultant who helps leaders make well-reasoned decisions under uncertainty.

OBJECTIVE: Help me decide between the following options for {{decision_context}}.

OPTIONS:
{{options_list}}

DECISION CRITERIA (in priority order): {{criteria}}

REASONING STRATEGY: For each option, evaluate it against every criterion individually before forming an overall view. Explicitly note where options trade off against each other. Consider at least one risk or blind spot per option.

OUTPUT FORMAT: A comparison table (Options x Criteria), followed by a short narrative recommendation with your reasoning, and one alternative worth considering if my priorities shifted.

CONSTRAINTS: Do not default to the "safest" option just because it's safest — weigh it fairly against the stated criteria. Be willing to recommend a clear option rather than staying neutral.

QUALITY CHECK: Would this analysis change someone's mind, or does it just restate what they already believe? Sharpen it if it's too neutral.`,
      variables:[
        {key:'decision_context', label:'What are you deciding?', type:'text', placeholder:'e.g. which CRM platform to adopt'},
        {key:'options_list', label:'List your options', type:'textarea', placeholder:'e.g. 1. HubSpot  2. Salesforce  3. Stay with spreadsheets'},
        {key:'criteria', label:'Your decision criteria, in priority order', type:'textarea', placeholder:'e.g. 1. Cost  2. Ease of adoption by team  3. Reporting features'}
      ],
      practices:[
        'Rank your criteria in priority order — without it, the AI will weigh them equally, which is rarely true.',
        'Ask explicitly for a "would this change someone\'s mind" self-check — it noticeably sharpens weak recommendations.',
        'Good to pair with the Loop Builder if you want the AI to iterate the analysis against new information you feed it.'
      ],
      example:'Used for: comparing 3 vendor proposals against cost, implementation time, and scalability before a client recommendation.'
    },
    {
      id:'wf-premortem', category:'strategy', builtin:true, favorite:false,
      title:'Pre-Mortem / Risk Stress-Test',
      desc:'Pressure-test a plan by imagining it failed, before you commit to it.',
      tags:['strategy','risk','planning'],
      template:`ROLE: You are a skeptical but constructive advisor whose job is to find real weaknesses in plans before they become expensive mistakes.

OBJECTIVE: Run a pre-mortem on this plan: {{plan_summary}}

REASONING STRATEGY: Imagine it is {{timeframe}} in the future and the plan has failed. Work backward: generate the 5 most plausible reasons it failed, ranked by likelihood. For each, suggest one concrete mitigation.

OUTPUT FORMAT: A ranked list of failure modes, each with: likelihood (high/med/low), early warning sign to watch for, and a mitigation.

CONSTRAINTS: Avoid generic risks like "market conditions change" unless you can make them specific to this plan. Be genuinely critical — do not soften findings to be polite.`,
      variables:[
        {key:'plan_summary', label:'Summarize the plan', type:'textarea', placeholder:'e.g. Launching a new service line targeting mid-market clients in Q1...'},
        {key:'timeframe', label:'How far in the future to imagine failure', type:'select', options:['3 months','6 months','1 year']}
      ],
      practices:[
        'Run this before finalizing any plan you\'re presenting externally — cheap insurance against blind spots.',
        'If the risks feel generic, add more specific context to the plan summary and re-run.'
      ],
      example:'Used for: stress-testing a client onboarding process redesign before rolling it out company-wide.'
    },
    // WRITING
    {
      id:'wf-client-email', category:'writing', builtin:true, favorite:true,
      title:'Client / Stakeholder Email Drafter',
      desc:'Draft a polished client email that matches your voice, without starting from a blank page.',
      tags:['writing','email','client'],
      template:`ROLE: You are an experienced business consultant writing on my behalf, matching a professional but human tone.

OBJECTIVE: Draft an email to {{recipient}} about {{email_purpose}}.

CONTEXT: {{background_context}}

KEY POINTS TO INCLUDE:
{{key_points}}

TONE: {{tone}}

OUTPUT FORMAT: Subject line + email body. Keep paragraphs short (2-3 sentences max). End with a clear, single call to action.

CONSTRAINTS: Do not use corporate filler phrases ("I hope this finds you well", "circling back", "per my last email"). Be direct and warm instead.`,
      variables:[
        {key:'recipient', label:'Who is this to?', type:'text', placeholder:'e.g. the client\'s VP of Operations'},
        {key:'email_purpose', label:'Purpose of the email', type:'text', placeholder:'e.g. delivering bad news about a timeline delay'},
        {key:'background_context', label:'Relevant background', type:'textarea', placeholder:'e.g. we promised delivery by Friday, a vendor issue pushed it to next Wednesday...'},
        {key:'key_points', label:'Key points to include', type:'textarea', placeholder:'- New date: next Wednesday\n- Reason (brief, no excuses)\n- What we are doing to prevent recurrence'},
        {key:'tone', label:'Tone', type:'select', options:['Professional and warm','Formal / high-stakes','Friendly and casual','Apologetic but confident']}
      ],
      practices:[
        'Give 3-5 bullet key points rather than full sentences — lets the AI do the actual writing work.',
        'Always specify tone explicitly for anything client-facing; default AI tone tends to be blandly formal.',
        'Ask for 2 versions (e.g. "shorter" and "more detailed") if you\'re unsure which will land better.'
      ],
      example:'Used for: delivering a project delay notice to a client without sounding defensive or overly apologetic.'
    },
    {
      id:'wf-report-draft', category:'writing', builtin:true, favorite:true,
      title:'Report / Memo First Draft',
      desc:'Turn bullet-point notes into a structured first draft of a report or internal memo.',
      tags:['writing','report','memo'],
      template:`ROLE: You are a consultant ghostwriting a report in my voice — clear, structured, and free of jargon padding.

OBJECTIVE: Turn my notes below into a first draft of a {{doc_type}} on {{topic}}.

AUDIENCE: {{audience}}

MY NOTES (rough, unordered):
{{raw_notes}}

REASONING STRATEGY: First identify the natural structure implied by the notes (don't force a generic template). Then organize the notes into that structure. Then write full prose only after the structure is set.

OUTPUT FORMAT: {{format_pref}}

      variables:[

// ---- App State ----
let state = {
  workflows: [],
  view: 'dashboard',
  searchQuery: '',
  filterCategory: 'all',
  filterFavOnly: false,
  promptBuilderBlocks: [],
  loopBuilderState: null
};

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state.workflows = parsed.workflows || defaultWorkflows();
    }catch(e){ state.workflows = defaultWorkflows(); }
  } else {
    state.workflows = defaultWorkflows();
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({workflows: state.workflows}));
}

/* =========================================================================
   UTIL
   ========================================================================= */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>'+escapeHtml(msg)+'</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}
function copyToClipboard(text, msg){
  navigator.clipboard.writeText(text).then(()=> showToast(msg || 'Copied to clipboard')).catch(()=>{
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast(msg || 'Copied to clipboard');
  });
}
function iconSvg(name){
  const icons = {
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    bars:'<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
    compass:'<path d="M12 2l2.5 6.5L21 11l-6.5 2.5L12 20l-2.5-6.5L3 11l6.5-2.5z"/>',
    pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    star:'<path d="M12 2l3 7 7 1-5.5 5 1.5 7-6-3.5L6 22l1.5-7L2 10l7-1z"/>'
  };
  return '<svg viewBox="0 0 24 24">'+ (icons[name]||icons.star) +'</svg>';
}

const TOPBAR_TEXT = {
  dashboard: ['Dashboard', 'Your saved AI workflows, at a glance'],
  research: ['Research & Summaries', 'Workflows for turning sources into decision-ready briefs'],
  data: ['Data & Spreadsheets', 'Workflows for cleaning, analyzing, and explaining data'],
  strategy: ['Strategy & Decisions', 'Workflows for structuring fuzzy problems into clear options'],
  writing: ['Writing & Communication', 'Workflows for client- and stakeholder-ready writing'],
  myworkflows: ['My Saved Workflows', 'Workflows you have created, edited, or duplicated'],
  promptbuilder: ['Prompt Builder', 'Assemble a custom prompt from reusable building blocks'],
  loopbuilder: ['Loop Builder', 'Turn a one-off prompt into a self-checking, autonomous loop']
};

function render(){
  const [title, subtitle] = TOPBAR_TEXT[state.view] || ['', ''];
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('topbarSubtitle').textContent = subtitle;

  const content = document.getElementById('content');
  content.innerHTML = '';

  if(state.view === 'dashboard') content.appendChild(renderDashboard());
  else if(['research','data','strategy','writing'].includes(state.view)) content.appendChild(renderCategoryView(state.view));
  else if(state.view === 'myworkflows') content.appendChild(renderMyWorkflows());
  else if(state.view === 'promptbuilder') content.appendChild(renderPromptBuilder());
  else if(state.view === 'loopbuilder') content.appendChild(renderLoopBuilder());
}

function renderCategoryView(cat){
  const meta = CATEGORY_META[cat];
  const frag = document.createElement('div');

  const header = document.createElement('div');
  header.className = 'view-header';
  header.innerHTML = `<h2>${meta.label}</h2><p>${meta.desc}</p>`;
  frag.appendChild(header);

  frag.appendChild(renderToolbar(cat));

  const list = state.workflows.filter(w=>{
    if(w.category !== cat) return false;
    if(state.filterFavOnly && !w.favorite) return false;
    if(state.searchQuery){
      const q = state.searchQuery.toLowerCase();
      const hay = (w.title+' '+w.desc+' '+(w.tags||[]).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  frag.appendChild(renderWorkflowGrid(list, 'No workflows match', 'Try clearing your search or filters, or create a new workflow for this category.'));
  return frag;
}

  const bar = document.createElement('div');

/* =========================================================================
   WORKFLOW GRID + CARD
   ========================================================================= */
function renderWorkflowGrid(list, emptyTitle, emptyDesc){
  const wrap = document.createElement('div');
  if(list.length === 0){
    wrap.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
        <h4>${escapeHtml(emptyTitle)}</h4>
        <p>${escapeHtml(emptyDesc)}</p>
      </div>`;
    return wrap;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  list.forEach(w=> grid.appendChild(renderWorkflowCard(w)));
  wrap.appendChild(grid);
  return wrap;
}

function renderWorkflowCard(w){
  const card = document.createElement('div');
  card.className = 'card';
  const catLabel = CATEGORY_META[w.category]?.label || 'Custom';
  card.innerHTML = `
    <div class="card-top">
      <span class="card-badge">${escapeHtml(catLabel)}</span>
      <button class="fav-btn ${w.favorite?'active':''}" title="${w.favorite?'Remove from favorites':'Add to favorites'}" onclick="toggleFavorite('${w.id}')">
        <svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5.5 5 1.5 7-6-3.5L6 22l1.5-7L2 10l7-1z"/></svg>
      </button>
    </div>
    <h4>${escapeHtml(w.title)}</h4>
    <p class="card-desc">${escapeHtml(w.desc)}</p>
    <div class="card-meta">
      <span>${(w.variables||[]).length} variables</span>
      ${w.builtin ? '<span>· Built-in</span>' : '<span>· Custom</span>'}
    </div>
    <div class="card-actions">
      <button class="btn btn-sm btn-primary" onclick="openWorkflowDetail('${w.id}')">Open</button>
      <button class="btn btn-sm" onclick="duplicateWorkflow('${w.id}')">Duplicate</button>
      ${!w.builtin ? `<button class="btn btn-sm btn-danger" onclick="deleteWorkflow('${w.id}')">Delete</button>` : ''}
    </div>
  `;
  return card;
}

function toggleFavorite(id){
  const w = state.workflows.find(x=>x.id===id);
  if(w){ w.favorite = !w.favorite; saveState(); render(); showToast(w.favorite?'Added to favorites':'Removed from favorites'); }
}
function duplicateWorkflow(id){
  const w = state.workflows.find(x=>x.id===id);
  if(!w) return;
  const copy = JSON.parse(JSON.stringify(w));
  copy.id = uid('wf');
  copy.builtin = false;
  copy._edited = true;
  copy.title = w.title + ' (copy)';
  state.workflows.push(copy);
  saveState();
  showToast('Duplicated — find it in My Saved Workflows');
  render();
  openWorkflowDetail(copy.id);
}
function deleteWorkflow(id){
  if(!confirm('Delete this workflow? This cannot be undone.')) return;
  state.workflows = state.workflows.filter(x=>x.id!==id);
  saveState();
  render();
  showToast('Workflow deleted');
}

/* =========================================================================
   WORKFLOW DETAIL MODAL (fill variables, live prompt, copy)
   ========================================================================= */
function openWorkflowDetail(id){
  const w = state.workflows.find(x=>x.id===id);
  if(!w) return;
  const values = {};
  (w.variables||[]).forEach(v=> values[v.key] = '');

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };

  overlay.innerHTML = `
    <div class="modal wide">
      <div class="modal-header">
        <div>
          <h3>${escapeHtml(w.title)}</h3>
          <p>${escapeHtml(w.desc)}</p>
        </div>
        <button class="btn btn-icon" onclick="this.closest('.modal-overlay').remove()" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="template-body" style="padding:0; grid-template-columns:1fr 300px;">
          <div>
            <div class="var-panel" style="margin-bottom:14px;">
              <h4>Fill in your details</h4>
              <div id="varFields"></div>
            </div>
            <h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:8px;">Live prompt preview</h4>
            <div class="prompt-box" id="livePromptPreview"></div>
            <div class="best-practices">
              <h4>Best practices</h4>
              <ul>${(w.practices||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>
            </div>
            ${w.example ? `<div class="example-block"><strong>Example use</strong>${escapeHtml(w.example)}</div>` : ''}
          </div>
          <div>
            <div class="var-panel">
              <h4>About this workflow</h4>
              <div style="font-size:12.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:8px;">
                <div><strong style="color:var(--ink);">Category:</strong> ${escapeHtml(CATEGORY_META[w.category]?.label || 'Custom')}</div>
                <div><strong style="color:var(--ink);">Variables:</strong> ${(w.variables||[]).length}</div>
                <div><strong style="color:var(--ink);">Tags:</strong> ${(w.tags||[]).join(', ') || '—'}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="openEditWorkflowModal('${w.id}'); this.closest('.modal-overlay').remove();">Edit template</button>
        <button class="btn btn-primary" id="copyPromptBtn">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy prompt
        </button>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').appendChild(overlay);

  const varFields = overlay.querySelector('#varFields');
  (w.variables||[]).forEach(v=>{
    const item = document.createElement('div');
    item.className = 'var-item';
    let inputHtml = '';
    if(v.type === 'select'){
      inputHtml = `<select data-key="${v.key}">${v.options.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`;
      values[v.key] = v.options[0];
    } else if(v.type === 'textarea'){
      inputHtml = `<textarea data-key="${v.key}" rows="3" placeholder="${escapeHtml(v.placeholder||'')}"></textarea>`;
    } else {
      inputHtml = `<input type="text" data-key="${v.key}" placeholder="${escapeHtml(v.placeholder||'')}">`;
    }
    item.innerHTML = `<label><span class="mono">{{${v.key}}}</span> ${escapeHtml(v.label)}</label>${inputHtml}`;
    varFields.appendChild(item);
  });

  function updatePreview(){
    let text = w.template;
    (w.variables||[]).forEach(v=>{
      const val = values[v.key] || `{{${v.key}}}`;
      text = text.split(`{{${v.key}}}`).join(val);
    });
    document.getElementById('livePromptPreview').textContent = text;
  }
  varFields.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('input', ()=>{ values[el.dataset.key] = el.value; updatePreview(); });
    el.addEventListener('change', ()=>{ values[el.dataset.key] = el.value; updatePreview(); });
  });
  updatePreview();

  overlay.querySelector('#copyPromptBtn').addEventListener('click', ()=>{
    copyToClipboard(document.getElementById('livePromptPreview').textContent, 'Prompt copied — paste it into Claude or ChatGPT');
  });
}

        <div><h3>${isNew?'Create a workflow':'Edit workflow'}</h3><p>Write a reusable prompt template. Use <span class="mono">{{variable_name}}</span> anywhere you want a fill-in-the-blank field.</p></div>

        </div>
        <div class="field">
          <label>Prompt template</label>
          <textarea id="ed_template" rows="10" placeholder="Write your prompt. Use {{variable_name}} for fill-in fields.">${escapeHtml(draft.template)}</textarea>
          <div class="hint">Tip: structure it with ROLE / OBJECTIVE / CONTEXT / CONSTRAINTS / OUTPUT FORMAT sections for best results.</div>
        </div>
        <div class="field">
          <label>Variables (comma-separated names, no spaces — must match {{names}} used above)</label>

    const category = overlay.querySelector('#ed_category').value;
    const template = overlay.querySelector('#ed_template').value;
    const varNames = overlay.querySelector('#ed_variables').value.split(',').map(s=>s.trim()).filter(Boolean);
    const practices = overlay.querySelector('#ed_practices').value.split('\\n').map(s=>s.trim()).filter(Boolean);

    if(!title || !template){ showToast('Title and template are required'); return; }

    draft.title = title; draft.desc = desc || 'Custom workflow.'; draft.category = category;
    draft.template = template; draft.practices = practices;
    draft.variables = varNames.map(name=>{
      const existingVar = (draft.variables||[]).find(v=>v.key===name);
      return existingVar || {key:name, label:name.replace(/_/g,' '), type:'text', placeholder:''};
    });
    draft._edited = true;

    if(isNew){
      state.workflows.push(draft);
    } else {
      const idx = state.workflows.findIndex(x=>x.id===draft.id);
      if(idx>-1) state.workflows[idx] = draft;
    }
    saveState();
    overlay.remove();
    showToast(isNew?'Workflow created':'Workflow updated');
    render();
    setView('myworkflows');
  });
}

/* =========================================================================
   PROMPT BUILDER
   ========================================================================= */
function renderPromptBuilder(){
  const frag = document.createElement('div');
  const header = document.createElement('div');
  header.className = 'view-header';
  header.innerHTML = `<h2>Prompt Builder</h2><p>Assemble a prompt from reusable building blocks. Add the blocks you need, fill each one in, and watch the full prompt take shape on the right.</p>`;
  frag.appendChild(header);

  const layout = document.createElement('div');
  layout.className = 'builder-layout';

  // LEFT: block picker
  const left = document.createElement('div');
  left.innerHTML = `<h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:10px;">Building blocks</h4>`;
  const picker = document.createElement('div');
  picker.className = 'block-picker';
  Object.entries(BLOCK_LIBRARY).forEach(([key, block])=>{
    const added = state.promptBuilderBlocks.some(b=>b.key===key);
    const opt = document.createElement('div');
    opt.className = 'block-option' + (added ? ' added':'');
    opt.innerHTML = `
      <div class="block-option-top">
        <strong>${block.label}</strong>
        <div class="block-add-icon">${added ? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'}</div>
      </div>
      <p>${block.why}</p>
    `;
    opt.addEventListener('click', ()=>{ if(!added){ addBlock(key); } });
    picker.appendChild(opt);
  });
  left.appendChild(picker);
  layout.appendChild(left);

  // RIGHT: assembled + preview
  const right = document.createElement('div');
  const assembledWrap = document.createElement('div');
  assembledWrap.innerHTML = `<h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin-bottom:10px;">Your prompt</h4>`;
  const list = document.createElement('div');
  list.className = 'assembled-list';
  list.id = 'assembledList';
  if(state.promptBuilderBlocks.length === 0){
    list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><h4>No blocks added yet</h4><p>Pick building blocks from the left — start with Role and Objective for most tasks.</p></div>`;
  } else {
    state.promptBuilderBlocks.forEach((b, i)=>{
      const def = BLOCK_LIBRARY[b.key];
      const blk = document.createElement('div');
      blk.className = 'assembled-block';
      blk.innerHTML = `
        <div class="assembled-block-head">
          <span class="tag">${def.label}</span>
          <button class="remove-block" title="Remove block" onclick="removeBlock(${i})"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="why">${def.why}</div>
        <textarea data-idx="${i}" placeholder="${def.placeholder}">${escapeHtml(b.value)}</textarea>
      `;
      list.appendChild(blk);
    });
  }
  assembledWrap.appendChild(list);
  right.appendChild(assembledWrap);
  layout.appendChild(right);

  frag.appendChild(layout);

  // preview panel — placed as fixed column via CSS grid trick: append after layout, use sticky
  const previewOuter = document.createElement('div');
  previewOuter.style.marginTop = '20px';
  previewOuter.innerHTML = `
    <div class="preview-panel" style="position:static;">
      <h4>Live preview</h4>
      <div class="preview-text" id="promptPreviewText"></div>
      <div class="preview-actions">
        <button class="btn btn-primary btn-sm" onclick="copyBuilderPrompt()">Copy prompt</button>
        <button class="btn btn-sm" onclick="saveBuilderAsWorkflow()">Save as workflow</button>
        <button class="btn btn-sm" onclick="clearBuilder()">Clear all</button>
        <button class="btn btn-sm" onclick="sendBuilderToLoop()">Send to Loop Builder →</button>
      </div>
    </div>
  `;
  frag.appendChild(previewOuter);

  requestAnimationFrame(()=>{
    document.querySelectorAll('#assembledList textarea').forEach(ta=>{
      ta.addEventListener('input', ()=>{
        state.promptBuilderBlocks[ta.dataset.idx].value = ta.value;
        updateBuilderPreview();
      });
    });
    updateBuilderPreview();
  });

  return frag;
}
function addBlock(key){
  state.promptBuilderBlocks.push({key, value:''});
  render();
}
function removeBlock(i){
  state.promptBuilderBlocks.splice(i,1);
  render();
}
function clearBuilder(){
  if(state.promptBuilderBlocks.length && !confirm('Clear all blocks from the current prompt?')) return;
  state.promptBuilderBlocks = [];
  render();
}
function updateBuilderPreview(){
  const el = document.getElementById('promptPreviewText');
  if(!el) return;
  const text = compileBuilderPrompt();
  el.textContent = text || 'Add blocks on the left to see your prompt build here...';
}
function compileBuilderPrompt(){
  return state.promptBuilderBlocks
    .filter(b=>b.value && b.value.trim())
    .map(b=> `${BLOCK_LIBRARY[b.key].label.toUpperCase()}:\n${b.value.trim()}`)
    .join('\n\n');
}
function copyBuilderPrompt(){
  const text = compileBuilderPrompt();
  if(!text){ showToast('Add some content to your blocks first'); return; }
  copyToClipboard(text, 'Prompt copied — paste it into Claude or ChatGPT');
}
function saveBuilderAsWorkflow(){
  const text = compileBuilderPrompt();
  if(!text){ showToast('Add some content to your blocks first'); return; }
  const draft = {
    id: uid('wf'), category:'research', builtin:false, _edited:true, favorite:false,
    title:'Custom prompt from Builder', desc:'Created with the Prompt Builder.',
    tags:['builder'], template:text, variables:[], practices:[], example:''
  };
  state.workflows.push(draft);
  saveState();
  showToast('Saved to My Workflows — you can edit it anytime');
  openEditWorkflowModal(draft.id);
}
function sendBuilderToLoop(){
  const text = compileBuilderPrompt();
  if(!text){ showToast('Build a prompt first, then send it to the Loop Builder'); return; }
  state.loopBuilderState = state.loopBuilderState || newLoopState();
  state.loopBuilderState.basePrompt = text;
  setView('loopbuilder');
  showToast('Prompt sent to Loop Builder');
}

/* =========================================================================
   LOOP BUILDER
   ========================================================================= */
function newLoopState(){
  return {
    basePrompt:'', goal:'', evaluation:'', strategy:'', stopConditions:'', maxIterations:'5', safety:''
  };
}
function renderLoopBuilder(){
  if(!state.loopBuilderState) state.loopBuilderState = newLoopState();
  const s = state.loopBuilderState;

  const frag = document.createElement('div');
  const header = document.createElement('div');
  header.className = 'view-header';
  header.innerHTML = `<h2>Loop Builder</h2><p>Turn a normal prompt into an <strong>autonomous loop</strong> — a prompt that checks its own output against your criteria, improves it, and repeats until it meets your bar or hits a stop condition you define.</p>`;
  frag.appendChild(header);

  const steps = document.createElement('div');
  steps.className = 'loop-steps';
  steps.innerHTML = `
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">1</div><strong>Base prompt</strong></div>
      <p class="desc">The task you want repeated and refined. You can paste one directly, or build one in the Prompt Builder and send it here.</p>
      <div class="step-body">
        <textarea id="loop_base" rows="4" placeholder="e.g. Draft a client onboarding email sequence...">${escapeHtml(s.basePrompt)}</textarea>
      </div>
    </div>
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">2</div><strong>Goal</strong></div>
      <p class="desc">What "done well" looks like — the target the AI is working toward, stated as an outcome, not just a task.</p>
      <div class="step-body">
        <textarea id="loop_goal" rows="2" placeholder="e.g. A 3-email sequence that a new client would find genuinely helpful, not salesy.">${escapeHtml(s.goal)}</textarea>
      </div>
    </div>
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">3</div><strong>Evaluation criteria</strong></div>
      <p class="desc">The specific, checkable standards the AI should judge each draft against before deciding whether to improve it further.</p>
      <div class="step-body">
        <textarea id="loop_eval" rows="3" placeholder="e.g. 1. Tone is warm, not salesy  2. Each email has one clear action  3. Under 150 words each">${escapeHtml(s.evaluation)}</textarea>
      </div>
    </div>
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">4</div><strong>Improvement strategy</strong></div>
      <p class="desc">How the AI should revise between iterations — e.g. fix the single weakest part each round, rather than rewriting everything blindly.</p>
      <div class="step-body">
        <select id="loop_strategy_preset">
          <option value="">— Choose a preset or write your own below —</option>
          <option value="Each round, identify the single weakest part against the evaluation criteria and revise only that part.">Fix one weak spot per round</option>
          <option value="Each round, produce two variations, compare them against the criteria, and keep the stronger one, carrying its strengths forward.">Compare variations, keep the best</option>
          <option value="Each round, ask 'what would an expert critic say is still wrong' and address only that critique.">Expert critique per round</option>
        </select>
        <textarea id="loop_strategy" rows="2" placeholder="Describe how each revision round should work...">${escapeHtml(s.strategy)}</textarea>
      </div>
    </div>
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">5</div><strong>Stop conditions</strong></div>
      <p class="desc">When the loop should end — either because the output is good enough, or as a safety net so it doesn't run forever.</p>
      <div class="step-body">
        <textarea id="loop_stop" rows="2" placeholder="e.g. Stop when all evaluation criteria are met, or after 5 rounds, whichever comes first.">${escapeHtml(s.stopConditions)}</textarea>
        <div class="field" style="margin-top:10px; max-width:200px;">
          <label>Max iterations (hard cap)</label>
          <input type="text" id="loop_max" value="${escapeHtml(s.maxIterations)}" placeholder="5">
        </div>
      </div>
    </div>
    <div class="loop-step">
      <div class="loop-step-head"><div class="loop-step-num">6</div><strong>Safety rules</strong></div>
      <p class="desc">Guardrails the loop must never cross while iterating, even in pursuit of the goal — keeps autonomous refinement from drifting off course.</p>
      <div class="step-body">
        <textarea id="loop_safety" rows="2" placeholder="e.g. Never invent client names or figures. Never remove the unsubscribe line. Ask me before sending anything externally.">${escapeHtml(s.safety)}</textarea>
      </div>
    </div>
  `;
  frag.appendChild(steps);

  const previewOuter = document.createElement('div');
  previewOuter.style.marginTop = '20px';
  previewOuter.innerHTML = `
    <div class="preview-panel" style="position:static;">
      <h4>Compiled loop prompt</h4>
      <div class="preview-text" id="loopPreviewText"></div>
      <div class="preview-actions">
        <button class="btn btn-primary btn-sm" onclick="copyLoopPrompt()">Copy loop prompt</button>
        <button class="btn btn-sm" onclick="saveLoopAsWorkflow()">Save as workflow</button>
        <button class="btn btn-sm" onclick="clearLoop()">Clear all</button>
      </div>
    </div>
  `;
  frag.appendChild(previewOuter);

  requestAnimationFrame(()=>{
    const ids = ['loop_base','loop_goal','loop_eval','loop_strategy','loop_stop','loop_max','loop_safety'];
    const map = {loop_base:'basePrompt',loop_goal:'goal',loop_eval:'evaluation',loop_strategy:'strategy',loop_stop:'stopConditions',loop_max:'maxIterations',loop_safety:'safety'};
    ids.forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', ()=>{ s[map[id]] = el.value; updateLoopPreview(); });
    });
    const preset = document.getElementById('loop_strategy_preset');
    preset.addEventListener('change', ()=>{
      if(preset.value){ document.getElementById('loop_strategy').value = preset.value; s.strategy = preset.value; updateLoopPreview(); }
    });
    updateLoopPreview();
  });

  return frag;
}
function compileLoopPrompt(){
  const s = state.loopBuilderState;
  if(!s) return '';
  let text = `You are running an autonomous improvement loop. Follow this process exactly.\n\n`;
  text += `TASK:\n${s.basePrompt || '[base prompt not yet filled in]'}\n\n`;
  text += `GOAL (what "done well" means):\n${s.goal || '[not set]'}\n\n`;
  text += `EVALUATION CRITERIA (check every draft against these):\n${s.evaluation || '[not set]'}\n\n`;
  text += `IMPROVEMENT STRATEGY (how to revise each round):\n${s.strategy || '[not set]'}\n\n`;
  text += `STOP CONDITIONS:\n${s.stopConditions || '[not set]'}\nHard cap: never exceed ${s.maxIterations || '5'} iterations, even if stop conditions aren't met — report your best attempt and explain what's still unresolved.\n\n`;
  text += `SAFETY RULES (never violate these, even to reach the goal faster):\n${s.safety || '[none specified — consider adding some]'}\n\n`;
  text += `PROCESS: On each round — (1) produce or revise the draft, (2) score it against the evaluation criteria explicitly, (3) if it fails any criterion, apply the improvement strategy and repeat, (4) if it passes all criteria or you hit the stop condition, present the final draft along with a short log of what changed each round.`;
  return text;
}
function updateLoopPreview(){
  const el = document.getElementById('loopPreviewText');
  if(el) el.textContent = compileLoopPrompt();
}
function copyLoopPrompt(){
  copyToClipboard(compileLoopPrompt(), 'Loop prompt copied — paste it into Claude or ChatGPT');
}
function clearLoop(){
  if(!confirm('Clear all Loop Builder fields?')) return;
  state.loopBuilderState = newLoopState();
  render();
}
function saveLoopAsWorkflow(){
  const text = compileLoopPrompt();
  const draft = {
    id: uid('wf'), category:'strategy', builtin:false, _edited:true, favorite:false,
    title:'Custom loop workflow', desc:'An autonomous, self-checking loop created with the Loop Builder.',
    tags:['loop','builder'], template:text, variables:[], practices:[
      "Run this in a fresh conversation so the AI isn't anchored to earlier drafts.",
      "Review the final output even after \"all criteria met\" — the AI's self-scoring is a guide, not a guarantee."
    ], example:''
  };
  state.workflows.push(draft);
  saveState();
  showToast('Saved to My Workflows');
  openEditWorkflowModal(draft.id);
}

/* =========================================================================
   THEME
   ========================================================================= */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
}
function applyTheme(theme){
  if(theme === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  else { document.documentElement.removeAttribute('data-theme'); }
  localStorage.setItem(THEME_KEY, theme);
  document.getElementById('themeLabel').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function exportData(){
  const blob = new Blob([JSON.stringify({workflows: state.workflows}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workbench-export.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Exported your workflow library');
}
function triggerImport(){ document.getElementById('importFile').click(); }
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.workflows && Array.isArray(data.workflows)){
        state.workflows = data.workflows;
        saveState();
        render();
        showToast('Import successful');
      } else {
        showToast("That file doesn't look like a valid export");
      }
    }catch(err){ showToast('Could not read that file'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
let gPressed = false;
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';

  if(e.key === 'Escape'){
    document.querySelectorAll('.modal-overlay').forEach(m=>m.remove());
    return;
  }
  if(typing) return;

  if(e.key.toLowerCase() === 'g'){ gPressed = true; setTimeout(()=> gPressed=false, 800); return; }
  if(gPressed){
    if(e.key.toLowerCase()==='d'){ setView('dashboard'); gPressed=false; }
    if(e.key.toLowerCase()==='p'){ setView('promptbuilder'); gPressed=false; }
    if(e.key.toLowerCase()==='l'){ setView('loopbuilder'); gPressed=false; }
    return;
  }
  if(e.key.toLowerCase()==='n'){ openNewWorkflowModal(); }
  if(e.key === '/'){ e.preventDefault(); const inp = document.querySelector('.search-box input'); if(inp) inp.focus(); }
  if(e.key.toLowerCase()==='t'){ toggleTheme(); }
  if(e.key === '?'){ openShortcuts(); }
});

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  loadState();
  const savedTheme = localStorage.getItem(THEME_KEY);
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  render();
  if(localStorage.getItem(ONBOARD_KEY) !== '1'){
    setTimeout(showOnboarding, 300);
  }
}
init();
</script>
