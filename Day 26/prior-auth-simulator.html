<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prior Authorization Workflow Simulator</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Blue palette: clinical trust + gamified energy
   ============================================================ */
:root {
  --navy:      #0a1628;
  --royal:     #1a3a6b;
  --cobalt:    #1e5fad;
  --sky:       #3a8fd1;
  --ice:       #c8e2f5;
  --frost:     #e8f4fc;
  --white:     #ffffff;
  --ink:       #0d1b2a;
  --slate:     #3d5166;
  --mist:      #8fa8be;
  --success:   #1a7f4b;
  --warn:      #b85c00;
  --danger:    #c0182a;
  --appeal:    #6b2fa0;
  --gold:      #d4a017;

  --radius:    10px;
  --shadow-s:  0 2px 8px rgba(10,22,40,0.12);
  --shadow-m:  0 6px 20px rgba(10,22,40,0.18);
  --shadow-l:  0 12px 40px rgba(10,22,40,0.28);

  --font-ui:   'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Courier New', monospace;
  --transition: 0.22s ease;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: var(--font-ui);
  background: var(--navy);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ============================================================
   HEADER
   ============================================================ */
#app-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--royal) 100%);
  color: var(--white);
  padding: 14px 24px 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-l);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}
.app-title {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.app-title span { color: var(--sky); }
.header-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-pill {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.8rem;
  color: var(--ice);
  white-space: nowrap;
}
.stat-pill strong { color: var(--white); font-size: 1rem; }

/* Progress bar */
#progress-track {
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  padding-bottom: 0;
  scrollbar-width: none;
}
#progress-track::-webkit-scrollbar { display: none; }
.prog-step {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 80px;
  position: relative;
}
.prog-step:not(:last-child)::after {
  content: '';
  flex: 1;
  height: 2px;
  background: rgba(255,255,255,0.15);
  transition: background var(--transition);
}
.prog-step.done:not(:last-child)::after { background: var(--sky); }
.prog-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--mist);
  transition: all var(--transition);
  flex-shrink: 0;
  cursor: default;
  position: relative;
}
.prog-step.done .prog-dot {
  background: var(--cobalt);
  border-color: var(--sky);
  color: var(--white);
}
.prog-step.active .prog-dot {
  background: var(--sky);
  border-color: var(--white);
  color: var(--navy);
  box-shadow: 0 0 0 4px rgba(58,143,209,0.35);
}
.prog-label {
  font-size: 0.62rem;
  color: rgba(255,255,255,0.45);
  text-align: center;
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  transition: color var(--transition);
}
.prog-step.done .prog-label,
.prog-step.active .prog-label { color: rgba(255,255,255,0.75); }

/* ============================================================
   MAIN LAYOUT
   ============================================================ */
#main {
  padding: 36px 20px 40px;
  max-width: 1300px;
  margin: 0 auto;
}

/* Scenario selector */
#scenario-selector {
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-m);
}
#scenario-selector h2 {
  font-size: 1.1rem;
  color: var(--royal);
  margin-bottom: 16px;
  font-weight: 700;
}
.scenario-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.scenario-card {
  border: 2px solid var(--ice);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all var(--transition);
  background: var(--frost);
}
.scenario-card:hover {
  border-color: var(--cobalt);
  background: var(--white);
  box-shadow: var(--shadow-s);
  transform: translateY(-2px);
}
.scenario-card.selected {
  border-color: var(--cobalt);
  background: var(--cobalt);
  color: var(--white);
}
.scenario-card .sc-icon { font-size: 2rem; margin-bottom: 8px; }
.scenario-card .sc-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
.scenario-card .sc-meta { font-size: 0.75rem; opacity: 0.7; }
.scenario-card.selected .sc-meta { opacity: 0.85; }

#start-btn {
  margin-top: 18px;
  background: linear-gradient(135deg, var(--cobalt), var(--sky));
  color: var(--white);
  border: none;
  border-radius: 8px;
  padding: 12px 32px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  box-shadow: var(--shadow-s);
}
#start-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-m);
}
#start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ============================================================
   WORKFLOW LANES
   ============================================================ */
#workflow-area { display: none; }

.lanes-header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 6px;
}
.lane-label {
  text-align: center;
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  padding: 8px;
  border-radius: 6px 6px 0 0;
  color: var(--white);
}
.lane-label.patient  { background: var(--royal); }
.lane-label.provider { background: var(--cobalt); }
.lane-label.payer    { background: var(--slate); }

.lanes-body {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  align-items: start;
}
.lane {
  background: var(--frost);
  border-radius: 0 0 var(--radius) var(--radius);
  border: 2px solid var(--ice);
  min-height: 300px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: background var(--transition), border-color var(--transition);
}
.lane.drag-over {
  background: #dceeff;
  border-color: var(--sky);
}

/* Case cards */
.case-card {
  background: var(--white);
  border-radius: 8px;
  border-left: 4px solid var(--cobalt);
  padding: 14px;
  box-shadow: var(--shadow-s);
  cursor: grab;
  transition: all var(--transition);
  user-select: none;
  position: relative;
}
.case-card:active { cursor: grabbing; }
.case-card.dragging {
  opacity: 0.45;
  transform: scale(0.97);
}
.case-card:hover {
  box-shadow: var(--shadow-m);
  transform: translateY(-2px);
}
.case-card.status-pending   { border-color: var(--warn); }
.case-card.status-approved  { border-color: var(--success); }
.case-card.status-denied    { border-color: var(--danger); }
.case-card.status-appeal    { border-color: var(--appeal); }
.case-card.status-p2p       { border-color: var(--gold); }

.cc-patient { font-weight: 700; font-size: 0.9rem; color: var(--ink); margin-bottom: 3px; }
.cc-type    { font-size: 0.75rem; color: var(--slate); margin-bottom: 8px; }
.cc-stage   { font-size: 0.72rem; font-weight: 600; color: var(--cobalt); }
.cc-days    { font-size: 0.7rem; color: var(--mist); margin-top: 4px; }
.cc-badge   {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 12px;
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.badge-active   { background: #e0f0ff; color: var(--cobalt); }
.badge-pending  { background: #fff0e0; color: var(--warn); }
.badge-approved { background: #e0f5ec; color: var(--success); }
.badge-denied   { background: #fce8ea; color: var(--danger); }
.badge-appeal   { background: #f3e8ff; color: var(--appeal); }
.badge-p2p      { background: #fff8e0; color: var(--gold); }

/* Action panel */
#action-panel {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--ice);
  padding: 20px;
  margin-top: 20px;
  box-shadow: var(--shadow-s);
}
#action-panel h3 {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--royal);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
#action-panel h3 .step-num {
  background: var(--cobalt);
  color: var(--white);
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
}
#action-explanation {
  font-size: 0.82rem;
  color: var(--slate);
  line-height: 1.6;
  background: var(--frost);
  border-left: 3px solid var(--sky);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 14px;
}
.action-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.action-btn {
  border: none;
  border-radius: 7px;
  padding: 10px 20px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
}
.action-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-s); }
.btn-primary   { background: var(--cobalt); color: var(--white); }
.btn-warn      { background: var(--warn);   color: var(--white); }
.btn-danger    { background: var(--danger); color: var(--white); }
.btn-success   { background: var(--success);color: var(--white); }
.btn-appeal    { background: var(--appeal); color: var(--white); }
.btn-gold      { background: var(--gold);   color: var(--ink); }
.btn-neutral   { background: var(--ice);    color: var(--slate); }

/* ============================================================
   DRAG GHOST
   ============================================================ */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  background: var(--cobalt);
  color: var(--white);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.8rem;
  font-weight: 700;
  box-shadow: var(--shadow-l);
  display: none;
  white-space: nowrap;
}

/* ============================================================
   MODAL OVERLAY (education, summary)
   ============================================================ */
#modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,22,40,0.72);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modal-overlay.visible { display: flex; }
#modal-box {
  background: var(--white);
  border-radius: 14px;
  max-width: 560px;
  width: 100%;
  padding: 30px;
  box-shadow: var(--shadow-l);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
#modal-box h2 {
  color: var(--royal);
  font-size: 1.2rem;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.modal-icon { font-size: 2rem; }
#modal-body {
  color: var(--slate);
  font-size: 0.85rem;
  line-height: 1.7;
  margin: 12px 0 20px;
}
#modal-body ul { padding-left: 18px; }
#modal-body li { margin-bottom: 6px; }
#modal-body strong { color: var(--ink); }
#modal-body .highlight-box {
  background: var(--frost);
  border-left: 3px solid var(--sky);
  padding: 10px 14px;
  border-radius: 0 6px 6px 0;
  margin-top: 12px;
}
#modal-close {
  background: var(--cobalt);
  color: var(--white);
  border: none;
  border-radius: 7px;
  padding: 11px 28px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
}
#modal-close:hover { background: var(--royal); }

/* ============================================================
   CELEBRATION
   ============================================================ */
#celebration {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  display: none;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall 3s linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ============================================================
   SUMMARY CARD
   ============================================================ */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}
.summary-item {
  background: var(--frost);
  border-radius: 8px;
  padding: 12px;
  border: 1px solid var(--ice);
}
.summary-item .si-label { font-size: 0.72rem; color: var(--mist); margin-bottom: 4px; }
.summary-item .si-value { font-size: 1.2rem; font-weight: 700; color: var(--royal); }

.score-bar-wrap { margin: 10px 0 4px; }
.score-bar-bg {
  background: var(--ice);
  border-radius: 8px;
  height: 12px;
  overflow: hidden;
}
.score-bar-fill {
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, var(--cobalt), var(--sky));
  transition: width 0.8s ease;
}
.score-label { font-size: 0.75rem; color: var(--slate); margin-top: 4px; }

/* ============================================================
   RESTART BUTTON
   ============================================================ */
#restart-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25);
  color: var(--white);
  border-radius: 7px;
  padding: 8px 18px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
}
#restart-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: var(--sky);
}

/* ============================================================
   UTILITY
   ============================================================ */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt8 { margin-top: 8px; }
.mt16 { margin-top: 16px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 700px) {
  .lanes-header, .lanes-body { grid-template-columns: 1fr; }
  .header-stats { gap: 8px; }
  .summary-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== DRAG GHOST ===== -->
<div id="drag-ghost">📋 Moving case…</div>

<!-- ===== CELEBRATION CANVAS ===== -->
<div id="celebration"></div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-box">
    <h2 id="modal-title"><span class="modal-icon" id="modal-icon">ℹ️</span><span id="modal-heading">Info</span></h2>
    <div id="modal-body"></div>
    <button id="modal-close">Got it — Continue</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<header id="app-header">
  <div class="header-top">
    <div class="app-title">Prior Auth <span>Workflow Simulator</span></div>
    <div class="header-stats">
      <div class="stat-pill">⏱ Day <strong id="days-stat">0</strong></div>
      <div class="stat-pill">⚡ Score <strong id="score-stat">100</strong></div>
      <div class="stat-pill">📋 <strong id="stage-stat">—</strong></div>
      <button id="restart-btn">↺ Restart / New Patient</button>
    </div>
  </div>
  <!-- Progress track (steps filled in by JS) -->
  <nav id="progress-track" aria-label="Workflow progress"></nav>
</header>

<!-- ===== MAIN ===== -->
<main id="main">

  <!-- Scenario selector (shown at start) -->
  <section id="scenario-selector">
    <h2>Select a Patient Scenario to Begin</h2>
    <div class="scenario-grid" id="scenario-grid"></div>
    <button id="start-btn" disabled>Start Workflow →</button>
  </section>

  <!-- Workflow area (hidden until game starts) -->
  <div id="workflow-area">
    <!-- Lane headers -->
    <div class="lanes-header">
      <div class="lane-label patient">🏥 Patient</div>
      <div class="lane-label provider">🩺 Provider</div>
      <div class="lane-label payer">🏦 Payer</div>
    </div>
    <!-- Lane bodies -->
    <div class="lanes-body">
      <div class="lane" id="lane-patient"  data-lane="patient"  aria-label="Patient lane"></div>
      <div class="lane" id="lane-provider" data-lane="provider" aria-label="Provider lane"></div>
      <div class="lane" id="lane-payer"    data-lane="payer"    aria-label="Payer lane"></div>
    </div>

    <!-- Action panel (instructions + buttons) -->
    <div id="action-panel">
      <h3><span class="step-num" id="action-step-num">1</span><span id="action-title">Next Step</span></h3>
      <div id="action-explanation">Select an action below to advance the workflow.</div>
      <div class="action-buttons" id="action-buttons"></div>
    </div>
  </div>

</main>

<script>
/* ============================================================
   PRIOR AUTH SIMULATOR — VANILLA JS
   All state lives in `state` object; no localStorage used.
   ============================================================ */

/* ============================================================
   SCENARIO DATA — edit this array to add/modify scenarios
   ============================================================ */
const SCENARIOS = [

/* ============================================================
   WORKFLOW STEPS
   Each step has: id, label (short), lane, description,
   educationTitle, educationHTML, actions[]
   Action: { label, btnClass, next, daysAdded, scoreEffect, outcome? }
   ============================================================ */
const WORKFLOW_STEPS = [
  {
    id: 'intake',
    label: 'Intake',
    lane: 'patient',
    description: 'Patient visits provider, service identified',
    educationTitle: 'Step 1 — Patient Intake & Service Identification',
    educationHTML: `
      <p>The PA process begins when a provider determines a patient needs a <strong>service that requires payer pre-approval</strong>. Common triggers:</p>

/* ============================================================
   PROGRESS LABELS (short names for progress track)
   ============================================================ */
const PROGRESS_LABELS = [
  { id: 'intake',        label: 'Intake' },
  { id: 'eligibility',  label: 'Eligibility' },
  { id: 'med-necessity',label: 'Med Necessity' },

/* ============================================================
   STATE
   ============================================================ */
let state = {
  selectedScenario: null,   // scenario object
  currentStep: null,        // step id string
  stepIndex: 0,             // progress index
  daysElapsed: 0,
  efficiencyScore: 100,
  outcome: null,            // 'approved' | 'denied' | 'appealed-approved' | 'accepted-denial'
  pendCount: 0,
  appealCount: 0,
  choiceHistory: [],        // {label, daysAdded, scoreEffect}
  dragCard: null,           // currently dragged element
};

/* ============================================================
   DOM REFS
   ============================================================ */
const els = {
  scenarioSelector: document.getElementById('scenario-selector'),
  scenarioGrid:     document.getElementById('scenario-grid'),
  startBtn:         document.getElementById('start-btn'),
  workflowArea:     document.getElementById('workflow-area'),
  lanePatient:      document.getElementById('lane-patient'),
  laneProvider:     document.getElementById('lane-provider'),
  lanePayer:        document.getElementById('lane-payer'),
  actionPanel:      document.getElementById('action-panel'),
  actionStepNum:    document.getElementById('action-step-num'),
  actionTitle:      document.getElementById('action-title'),
  actionExpl:       document.getElementById('action-explanation'),
  actionButtons:    document.getElementById('action-buttons'),
  progressTrack:    document.getElementById('progress-track'),
  daysStat:         document.getElementById('days-stat'),
  scoreStat:        document.getElementById('score-stat'),
  stageStat:        document.getElementById('stage-stat'),
  restartBtn:       document.getElementById('restart-btn'),
  modalOverlay:     document.getElementById('modal-overlay'),
  modalIcon:        document.getElementById('modal-icon'),
  modalHeading:     document.getElementById('modal-heading'),
  modalBody:        document.getElementById('modal-body'),
  modalClose:       document.getElementById('modal-close'),
  celebration:      document.getElementById('celebration'),
  dragGhost:        document.getElementById('drag-ghost'),
};

/* ============================================================
   INIT
   ============================================================ */
function init() {
  buildProgressTrack();
  buildScenarioGrid();

  els.startBtn.addEventListener('click', startWorkflow);
  els.restartBtn.addEventListener('click', restartWorkflow);
  els.modalClose.addEventListener('click', closeModal);

  // Drag-and-drop on lanes
  ['lane-patient', 'lane-provider', 'lane-payer'].forEach(id => {
    const lane = document.getElementById(id);
    lane.addEventListener('dragover',  onLaneDragOver);
    lane.addEventListener('dragleave', onLaneDragLeave);
    lane.addEventListener('drop',      onLaneDrop);
  });

  // Move ghost on mouse move
  document.addEventListener('mousemove', e => {
    els.dragGhost.style.left = (e.clientX + 14) + 'px';
    els.dragGhost.style.top  = (e.clientY + 8)  + 'px';
  });
}

/* ============================================================
   BUILD PROGRESS TRACK
   ============================================================ */
function buildProgressTrack() {
  els.progressTrack.innerHTML = '';
  PROGRESS_LABELS.forEach((pl, i) => {
    const step = document.createElement('div');
    step.className = 'prog-step';
    step.id = `prog-${pl.id}`;
    step.innerHTML = `
      <div class="prog-dot">${i + 1}</div>
      <span class="prog-label">${pl.label}</span>`;
    els.progressTrack.appendChild(step);
  });
}

/* ============================================================
   BUILD SCENARIO GRID
   ============================================================ */
function buildScenarioGrid() {
  els.scenarioGrid.innerHTML = '';
  SCENARIOS.forEach(sc => {
    const card = document.createElement('div');
    card.className = 'scenario-card';
    card.dataset.id = sc.id;
    card.innerHTML = `
      <div class="sc-icon">${sc.icon}</div>
      <div class="sc-name">${sc.name}</div>
      <div class="sc-meta">${sc.patient}<br>${sc.description}</div>`;
    card.addEventListener('click', () => selectScenario(sc, card));
    els.scenarioGrid.appendChild(card);
  });
}

/* ============================================================
   SCENARIO SELECTION
   ============================================================ */
function selectScenario(sc, cardEl) {
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  cardEl.classList.add('selected');
  state.selectedScenario = sc;
  els.startBtn.disabled = false;
}

/* ============================================================
   START WORKFLOW
   ============================================================ */
function startWorkflow() {
  if (!state.selectedScenario) return;

  // Reset state
  state.currentStep   = 'intake';
  state.stepIndex     = 0;
  state.daysElapsed   = 0;
  state.efficiencyScore = 100;
  state.outcome       = null;
  state.pendCount     = 0;
  state.appealCount   = 0;
  state.choiceHistory = [];

  // Show workflow, hide selector
  els.scenarioSelector.style.display = 'none';
  els.workflowArea.style.display = 'block';

  updateStats();
  clearLanes();
  placeInitialCard();
  goToStep('intake');
}

/* ============================================================
   RESTART
   ============================================================ */
function restartWorkflow() {
  // Reset UI
  clearLanes();
  els.workflowArea.style.display = 'none';
  els.scenarioSelector.style.display = '';
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  els.startBtn.disabled = true;
  state.selectedScenario = null;

  // Reset progress track
  document.querySelectorAll('.prog-step').forEach(s => s.classList.remove('active', 'done'));

  // Reset stats display
  els.daysStat.textContent   = '0';
  els.scoreStat.textContent  = '100';
  els.stageStat.textContent  = '—';

  stopCelebration();
}

/* ============================================================
   CARD CREATION & LANE MANAGEMENT
   ============================================================ */
function clearLanes() {
  els.lanePatient.innerHTML  = '';
  els.laneProvider.innerHTML = '';
  els.lanePayer.innerHTML    = '';
}

function placeInitialCard() {
  const card = buildCaseCard();
  els.lanePatient.appendChild(card);
}

function buildCaseCard() {
  const sc = state.selectedScenario;
  const card = document.createElement('div');
  card.className = 'case-card status-active';
  card.id = 'case-card';
  card.draggable = true;
  card.innerHTML = `
    <div class="cc-patient">${sc.icon} ${sc.patient}</div>
    <div class="cc-type">${sc.requestedService}</div>
    <div class="cc-stage" id="cc-stage-label">Intake</div>
    <div class="cc-days" id="cc-days-label">Day 0</div>
    <span class="cc-badge badge-active" id="cc-badge">Active</span>`;

  card.addEventListener('dragstart', onCardDragStart);
  card.addEventListener('dragend',   onCardDragEnd);
  return card;
}

function updateCardStatus(statusClass, badgeClass, badgeText, stageText) {
  const card = document.getElementById('case-card');
  if (!card) return;
  card.className = `case-card ${statusClass}`;
  card.querySelector('#cc-stage-label').textContent = stageText;
  card.querySelector('#cc-days-label').textContent  = `Day ${state.daysElapsed}`;
  const badge = card.querySelector('#cc-badge');
  badge.className = `cc-badge ${badgeClass}`;
  badge.textContent = badgeText;
}

function moveCardToLane(laneName) {
  const card = document.getElementById('case-card');
  if (!card) return;
  const lanes = { patient: els.lanePatient, provider: els.laneProvider, payer: els.lanePayer };
  Object.values(lanes).forEach(l => { if (l.contains(card)) l.removeChild(card); });
  lanes[laneName].appendChild(card);
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function onCardDragStart(e) {
  state.dragCard = e.target;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'case-card');

  // Show custom ghost
  els.dragGhost.style.display = 'block';
  els.dragGhost.textContent   = `📋 ${state.selectedScenario ? state.selectedScenario.patient : 'Case'}`;
  // Hide native ghost (replace with blank pixel)
  const blank = document.createElement('canvas');
  e.dataTransfer.setDragImage(blank, 0, 0);
}

function onCardDragEnd(e) {
  e.target.classList.remove('dragging');
  els.dragGhost.style.display = 'none';
  state.dragCard = null;
  document.querySelectorAll('.lane').forEach(l => l.classList.remove('drag-over'));
}

function onLaneDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onLaneDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onLaneDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');

  const targetLane = e.currentTarget.dataset.lane;
  const step = getCurrentStepDef();
  if (!step) return;

  // Only allow drop to the step's lane OR payer (to enable drag exploration)
  const allowedLane = step.lane;
  if (targetLane !== allowedLane) {
    showModal(
      'ℹ️',
      'Drag to the correct lane',
      `<p>This step belongs to the <strong>${capitalise(allowedLane)}</strong> lane. Drag the case card there to continue the workflow.</p>`,
      false
    );
    return;
  }

  moveCardToLane(targetLane);
  // Auto-fire the first action if drag completes
  if (step.actions && step.actions.length === 1) {
    handleAction(step.actions[0]);
  } else {
    showActionPanel(step);
  }
}

/* ============================================================
   STEP ENGINE
   ============================================================ */
function goToStep(stepId) {
  state.currentStep = stepId;
  const step = getStepDefById(stepId);
  if (!step) { console.warn('Unknown step:', stepId); return; }

  // Update progress track
  const progIdx = PROGRESS_LABELS.findIndex(p => p.id === stepId || stepId.startsWith('outcome'));
  if (progIdx >= 0) updateProgressTrack(progIdx);
  else if (stepId.startsWith('outcome')) updateProgressTrack(6);

  // Show education modal, then show action panel
  showModal(
    getStepIcon(stepId),
    step.educationTitle,
    step.educationHTML,
    true,
    () => {
      moveCardToLane(step.lane);
      updateCardStatus(
        `status-${getStepBadgeStatus(stepId)}`,
        `badge-${getStepBadgeStatus(stepId)}`,
        formatStepBadge(stepId),
        step.description
      );
      showActionPanel(step);
    }
  );

  updateStats();
}

function getCurrentStepDef() {
  return getStepDefById(state.currentStep);
}

function getStepDefById(id) {
  // Check main steps
  const main = WORKFLOW_STEPS.find(s => s.id === id);
  if (main) return main;
  // Check outcome steps
  return OUTCOME_STEPS[id] || getDynamicStep(id);
}

/* Dynamic steps for post-outcome branches */
function getDynamicStep(id) {
  if (id === 'outcome') return buildOutcomeStep();
  if (id === 'outcome-after-pend') return buildAfterPendStep();
  if (id === 'appeal') return buildAppealStep();
  if (id === 'p2p') return buildP2PStep();
  if (id === 'complete')   return buildCompleteStep();
  if (id === 'accepted-denial') return buildAcceptedDenialStep();
  if (id === 'no-pa-needed') return buildNoPAStep();
  return null;
}

/* ============================================================
   OUTCOME DETERMINATION (random weighted)
   ============================================================ */
function determineOutcome() {
  const sc  = state.selectedScenario;
  const w   = sc.outcomeWeights;
  const roll = Math.random() * 100;
  if (roll < w.approve) return 'approve';
  if (roll < w.approve + w.pend) return 'pend';
  return 'deny';
}

/* ============================================================
   DYNAMIC STEP BUILDERS
   ============================================================ */
function buildOutcomeStep() {
  const outcome = determineOutcome();
  return OUTCOME_STEPS[outcome] || OUTCOME_STEPS.deny;
}

function buildAfterPendStep() {
  // After responding to a pend, re-roll outcome (slightly better odds)
  const sc  = state.selectedScenario;
  const roll = Math.random() * 100;
  const approveChance = sc.outcomeWeights.approve + 15; // pend response helps
  if (roll < approveChance) {
    return {
      ...OUTCOME_STEPS.approve,
      id: 'outcome-after-pend',
      educationTitle: '✅ Pend Resolved — PA Approved!',
      educationHTML: OUTCOME_STEPS.approve.educationHTML,
    };
  }
  return {
    ...OUTCOME_STEPS.deny,
    id: 'outcome-after-pend',
    educationTitle: '❌ Pend Response Insufficient — Denied',
    educationHTML: `<p>The payer reviewed the additional documentation but determined it was <strong>still insufficient</strong> to meet medical necessity criteria.</p>
      <div class="highlight-box">You may still file a formal appeal or request a peer-to-peer review within the appeal timeframe.</div>`,
  };
}

function buildAppealStep() {
  state.appealCount++;
  const sc = state.selectedScenario;
  const win = Math.random() * 100 < sc.appealSuccessRate;
  return {
    id: 'appeal',
    label: 'Appeal',
    lane: 'payer',
    description: `First-level appeal ${win ? 'succeeded' : 'denied again'}`,
    educationTitle: win ? '🏆 Appeal Overturned — Approved!' : '📋 Appeal Denied',
    educationHTML: win
      ? `<p>The payer's appeal panel <strong>overturned the original denial</strong>. The service is now approved.</p>
         <ul>
           <li>The appeal was successful because additional clinical evidence was compelling</li>
           <li>An authorization number will be issued for the service</li>
         </ul>
         <div class="highlight-box">🌟 Appeals succeed 30–50% of the time. Always file when denial seems incorrect!</div>`
      : `<p>The first-level appeal was reviewed and the denial was <strong>upheld</strong>. Options remaining:</p>
         <ul>
           <li><strong>External/Independent Review:</strong> Required by ACA for non-grandfathered plans</li>
           <li><strong>State Insurance Commissioner Complaint</strong></li>
           <li><strong>Legal Action</strong> (for large claim amounts)</li>
         </ul>`,
    actions: win
      ? [{ label: '🎉 Complete Workflow & View Summary', btnClass: 'btn-success', next: 'complete', daysAdded: 0, scoreEffect: 15, finalOutcome: 'appealed-approved' }]
      : [{ label: '📂 Request External Independent Review', btnClass: 'btn-appeal', next: 'complete', daysAdded: 5, scoreEffect: -5, finalOutcome: 'external-appeal' },
         { label: '✋ Accept Final Denial', btnClass: 'btn-danger', next: 'complete', daysAdded: 0, scoreEffect: -20, finalOutcome: 'accepted-denial' }],
  };
}

function buildP2PStep() {
  const sc = state.selectedScenario;
  const win = Math.random() * 100 < (sc.appealSuccessRate + 10);
  return {
    id: 'p2p',
    label: 'Peer-to-Peer',
    lane: 'payer',
    description: `Peer-to-peer review ${win ? 'succeeded' : 'unsuccessful'}`,
    educationTitle: win ? '🤝 Peer-to-Peer Review — Approved!' : '📞 Peer-to-Peer Review — Upheld',
    educationHTML: win
      ? `<p>The treating physician spoke directly with the payer's medical director. The payer <strong>agreed to approve</strong> the service after the clinical discussion.</p>
         <ul>
           <li>P2P reviews are highly effective — often 40–60% overturn rate</li>
           <li>Must be requested within 24–48 hours of denial (payer-specific)</li>
         </ul>
         <div class="highlight-box">⭐ P2P review is often faster than a formal appeal and just as effective.</div>`
      : `<p>The payer's medical director reviewed the case with the treating physician but maintained the denial. The medical director felt the clinical criteria were not met.</p>
         <div class="highlight-box">You may still file a formal written appeal with additional evidence.</div>`,
    actions: win
      ? [{ label: '🎉 Complete Workflow', btnClass: 'btn-success', next: 'complete', daysAdded: 0, scoreEffect: 20, finalOutcome: 'p2p-approved' }]
      : [{ label: '📩 File Formal Appeal', btnClass: 'btn-appeal', next: 'appeal', daysAdded: 1, scoreEffect: 0 },
         { label: '✋ Accept Denial', btnClass: 'btn-danger', next: 'complete', daysAdded: 0, scoreEffect: -20, finalOutcome: 'accepted-denial' }],
  };
}

function buildCompleteStep() {
  return {
    id: 'complete',
    label: 'Complete',
    lane: 'payer',
    description: 'Workflow complete',
    educationTitle: 'Workflow Complete',
    educationHTML: '',
    actions: [],
  };
}

function buildAcceptedDenialStep() {
  return {
    id: 'accepted-denial',
    label: 'Denied',
    lane: 'payer',
    description: 'Denial accepted — patient notified',
    educationTitle: 'Denial Accepted',
    educationHTML: '',
    actions: [],
  };
}

function buildNoPAStep() {
  return {
    id: 'no-pa-needed',
    label: 'No PA',
    lane: 'patient',
    description: 'No PA required — proceed to service',
    educationTitle: '✅ No Prior Authorization Required',
    educationHTML: `<p>Great news! This service does <strong>not require prior authorization</strong> under this patient's plan. The provider can schedule and perform the service without a PA.</p>
      <div class="highlight-box">📋 Always document your eligibility check in case the payer questions coverage post-service.</div>`,
    actions: [{ label: '✅ Schedule Service — Complete', btnClass: 'btn-success', next: 'complete', daysAdded: 0, scoreEffect: 0, finalOutcome: 'no-pa' }],
  };
}

/* ============================================================
   ACTION HANDLER
   ============================================================ */
function handleAction(action) {
  // Record choice
  state.choiceHistory.push({
    label: action.label,
    daysAdded: action.daysAdded || 0,
    scoreEffect: action.scoreEffect || 0,
    step: state.currentStep,
  });

  // Apply effects
  state.daysElapsed    = Math.max(0, state.daysElapsed + (action.daysAdded || 0));
  state.efficiencyScore = Math.min(100, Math.max(0, state.efficiencyScore + (action.scoreEffect || 0)));

  // Set final outcome if action carries one
  if (action.finalOutcome) state.outcome = action.finalOutcome;

  updateStats();

  // Navigate
  const nextId = action.next;
  if (nextId === 'complete' || nextId === 'accepted-denial') {
    endWorkflow();
    return;
  }
  if (nextId === 'outcome') {
    goToStep('outcome'); // will call buildOutcomeStep()
    return;
  }
  goToStep(nextId);
}

/* ============================================================
   ACTION PANEL RENDER
   ============================================================ */
function showActionPanel(step) {
  const stepNum = Math.min(WORKFLOW_STEPS.findIndex(s => s.id === step.id) + 1, WORKFLOW_STEPS.length) || '●';
  els.actionStepNum.textContent = (typeof stepNum === 'number' && stepNum > 0) ? stepNum : '●';
  els.actionTitle.textContent   = step.description;
  els.actionExpl.innerHTML      = buildActionExplanation(step);

  els.actionButtons.innerHTML = '';
  (step.actions || []).forEach(action => {
    const btn = document.createElement('button');
    btn.className   = `action-btn ${action.btnClass}`;
    btn.textContent = action.label;
    if (action.daysAdded) {
      btn.title = `+${action.daysAdded} day(s), score ${action.scoreEffect >= 0 ? '+' : ''}${action.scoreEffect}`;
    }
    btn.addEventListener('click', () => handleAction(action));
    els.actionButtons.appendChild(btn);
  });

  // Scenario info if first two steps
  els.actionPanel.style.display = '';
}

function buildActionExplanation(step) {
  const sc = state.selectedScenario;
  let html = '';

  if (step.id === 'med-necessity') {
    html += `<strong>Medical Necessity Criteria for this case:</strong><ul>`;
    sc.medicalNecessityCriteria.forEach(c => { html += `<li>${c}</li>`; });
    html += `</ul>`;
  } else if (step.id === 'doc-collection') {
    html += `<strong>Required documents for ${sc.name}:</strong><ul>`;
    sc.requiredDocs.forEach(d => { html += `<li>📄 ${d}</li>`; });
    html += `</ul>`;
  } else {
    html = `<strong>${sc.patient}</strong> — ${sc.requestedService}<br>Payer: ${sc.payer} | Urgency: ${sc.urgency}`;
  }

  html += `<div style="margin-top:10px;font-size:0.78rem;color:var(--mist)">
    💡 <em>Tip: Drag the case card to the highlighted lane, then choose an action below.</em>
  </div>`;

  return html;
}

/* ============================================================
   PROGRESS TRACK UPDATER
   ============================================================ */
function updateProgressTrack(activeIdx) {
  document.querySelectorAll('.prog-step').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i < activeIdx)  el.classList.add('done');
    if (i === activeIdx) el.classList.add('active');
  });
}

/* ============================================================
   STATS UPDATER
   ============================================================ */
function updateStats() {
  els.daysStat.textContent  = state.daysElapsed;
  els.scoreStat.textContent = state.efficiencyScore;
  els.stageStat.textContent = state.currentStep ? formatStepLabel(state.currentStep) : '—';
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(icon, heading, bodyHTML, hasContinueBtn, onClose) {
  els.modalIcon.textContent    = icon;
  els.modalHeading.textContent = heading;
  els.modalBody.innerHTML      = bodyHTML;
  els.modalClose.style.display = hasContinueBtn ? '' : 'none';
  els.modalOverlay.classList.add('visible');

  // One-time close handler
  els.modalClose.onclick = () => {
    closeModal();
    if (onClose) onClose();
  };
}

function closeModal() {
  els.modalOverlay.classList.remove('visible');
}

/* ============================================================
   END WORKFLOW
   ============================================================ */
function endWorkflow() {
  updateProgressTrack(7); // last step

  const approved = ['approved', 'appealed-approved', 'p2p-approved', 'no-pa'].includes(state.outcome);

  if (approved) {
    triggerCelebration();
    updateCardStatus('status-approved', 'badge-approved', 'Approved ✅', 'Approved — Service Authorized');
  } else {
    updateCardStatus('status-denied', 'badge-denied', 'Denied ✗', 'Denial Accepted');
  }

  // Show summary modal
  showModal(
    approved ? '🎉' : '📋',
    approved ? 'Workflow Complete — PA Approved!' : 'Workflow Complete — PA Denied',
    buildSummaryHTML(approved),
    false
  );

  // Replace modal close with restart
  els.modalClose.style.display = '';
  els.modalClose.textContent   = '↺ Try Another Patient';
  els.modalClose.onclick       = () => { closeModal(); restartWorkflow(); };
  els.actionButtons.innerHTML  = '';
  els.actionTitle.textContent  = approved ? '🎉 Authorization Complete' : '📋 Case Closed';
  els.actionExpl.textContent   = 'Review the workflow summary above, then try another patient scenario.';
}

/* ============================================================
   SUMMARY HTML
   ============================================================ */
function buildSummaryHTML(approved) {
  const sc      = state.selectedScenario;
  const score   = state.efficiencyScore;
  const grade   = score >= 80 ? '⭐ Excellent' : score >= 60 ? '👍 Good' : score >= 40 ? '⚠️ Fair' : '🔴 Needs Work';
  const outcomeLabel = {
    approved:          'PA Approved (First Submission)',
    'appealed-approved':'Approved After Appeal',
    'p2p-approved':    'Approved After P2P Review',
    'accepted-denial': 'Denial Accepted',
    'external-appeal': 'Referred to External Review',
    'no-pa':           'No PA Required',
  }[state.outcome] || state.outcome;

  const scoreBar = `
    <div class="score-bar-wrap">
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${score}%"></div></div>
      <div class="score-label">${score}/100 — ${grade}</div>
    </div>`;

  let choiceLog = '';
  if (state.choiceHistory.length) {
    choiceLog = '<strong>Your decisions:</strong><ul>';
    state.choiceHistory.forEach(c => {
      const delta = c.scoreEffect !== 0
        ? ` <span style="color:${c.scoreEffect > 0 ? 'var(--success)' : 'var(--danger)'};">(${c.scoreEffect > 0 ? '+' : ''}${c.scoreEffect} pts)</span>`
        : '';
      choiceLog += `<li>${c.label.replace(/^[^\w]+/, '')}${delta}</li>`;
    });
    choiceLog += '</ul>';
  }

  return `
    <div class="summary-grid">
      <div class="summary-item">
        <div class="si-label">Patient</div>
        <div class="si-value" style="font-size:0.9rem">${sc.patient}</div>
      </div>
      <div class="summary-item">
        <div class="si-label">Service Requested</div>
        <div class="si-value" style="font-size:0.75rem">${sc.requestedService}</div>
      </div>
      <div class="summary-item">
        <div class="si-label">Days Elapsed</div>
        <div class="si-value">${state.daysElapsed} days</div>
      </div>
      <div class="summary-item">
        <div class="si-label">Typical Days</div>
        <div class="si-value">${sc.typicalDays} days</div>
      </div>
      <div class="summary-item">
        <div class="si-label">Final Outcome</div>
        <div class="si-value" style="font-size:0.8rem;color:${approved ? 'var(--success)' : 'var(--danger)'}">${outcomeLabel}</div>
      </div>
      <div class="summary-item">
        <div class="si-label">Appeals Filed</div>
        <div class="si-value">${state.appealCount}</div>
      </div>
    </div>
    <strong>Efficiency Score</strong>${scoreBar}
    <div class="mt16">${choiceLog}</div>
    <div class="highlight-box mt8">
      <strong>Key takeaway:</strong> ${approved
        ? 'A well-prepared PA with complete documentation and prompt follow-up leads to faster approvals and better patient outcomes.'
        : 'Denials can often be overturned with appeals or peer-to-peer review. Don\'t give up on clinically appropriate care!'
      }
    </div>`;
}

/* ============================================================
   CELEBRATION ANIMATION
   ============================================================ */
const CONFETTI_COLORS = ['#1e5fad','#3a8fd1','#c8e2f5','#d4a017','#1a7f4b','#ffffff'];

function triggerCelebration() {
  els.celebration.style.display = 'block';
  els.celebration.innerHTML = '';
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.cssText = `
      left:${Math.random() * 100}%;
      background:${color};
      width:${6 + Math.random() * 8}px;
      height:${6 + Math.random() * 8}px;
      border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      animation-delay:${Math.random() * 1.5}s;
      animation-duration:${2 + Math.random() * 2}s;
    `;
    els.celebration.appendChild(piece);
  }
  setTimeout(stopCelebration, 4000);
}

function stopCelebration() {
  els.celebration.innerHTML = '';
  els.celebration.style.display = 'none';
}

/* ============================================================
   HELPERS
   ============================================================ */
function capitalise(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function formatStepLabel(id) {
  const map = {
    intake: 'Intake', eligibility: 'Eligibility', 'med-necessity': 'Med Necessity',
    'doc-collection': 'Documents', submission: 'Submission', 'payer-review': 'Payer Review',
    outcome: 'Outcome', 'outcome-approve': 'Approved', 'outcome-pend': 'Pended',
    'outcome-deny': 'Denied', 'outcome-after-pend': 'Post-Pend', appeal: 'Appeal',
    p2p: 'Peer-to-Peer', complete: 'Complete', 'accepted-denial': 'Denied',
    'no-pa-needed': 'No PA Needed',
  };
  return map[id] || capitalise(id);
}

function getStepIcon(id) {
  const map = {
    intake: '🏥', eligibility: '✅', 'med-necessity': '🩺',
    'doc-collection': '📁', submission: '📤', 'payer-review': '🔍',
    'outcome-approve': '✅', 'outcome-pend': '⏸', 'outcome-deny': '❌',
    appeal: '📩', p2p: '📞', 'no-pa-needed': '✅', outcome: '🎲',
  };
  return map[id] || 'ℹ️';
}

function getStepBadgeStatus(id) {
  if (id.includes('approve')) return 'approved';
  if (id.includes('deny') || id === 'accepted-denial') return 'denied';
  if (id === 'appeal') return 'appeal';
  if (id === 'p2p') return 'p2p';
  if (id.includes('pend')) return 'pending';
  return 'active';
}

function formatStepBadge(id) {
  if (id.includes('approve')) return 'Approved';
  if (id.includes('deny')) return 'Denied';
  if (id === 'appeal') return 'In Appeal';
  if (id === 'p2p') return 'P2P Review';
  if (id.includes('pend')) return 'Pended';
  return 'Active';
}

/* ============================================================
   BOOT
   ============================================================ */
init();
</script>
